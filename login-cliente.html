<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login Cliente</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
padding:20px;
color:white;
}

.box{
background:#111827;
padding:35px;
border-radius:25px;
width:100%;
max-width:420px;
}

h1{
margin-bottom:10px;
font-size:32px;
}

p{
color:#94a3b8;
margin-bottom:25px;
line-height:1.6;
}

input{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#1e293b;
color:white;
margin-top:15px;
font-size:16px;
outline:none;
}

button{
width:100%;
padding:16px;
margin-top:20px;
border:none;
border-radius:12px;
background:#22c55e;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
opacity:0.9;
transform:translateY(-2px);
}

.criar{
display:block;
text-align:center;
margin-top:20px;
color:#38bdf8;
text-decoration:none;
font-weight:bold;
}

.erro{
background:#ef4444;
padding:14px;
border-radius:12px;
margin-top:20px;
display:none;
text-align:center;
}

</style>

</head>

<body>

<div class="box">

<h1>
🔐 Login Cliente
</h1>

<p>

Entre para acessar toda biblioteca de prompts IA.

</p>

<input
type="text"
id="whatsapp"
placeholder="Seu WhatsApp"
>

<input
type="password"
id="senha"
placeholder="Sua senha"
>

<button id="entrar">

🚀 Entrar

</button>

<div
class="erro"
id="erro"
>

WhatsApp ou senha inválidos

</div>

<a
href="cadastro.html"
class="criar"
>

📝 Criar Conta

</a>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
query,
where
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE */

const firebaseConfig = {

apiKey: "AIzaSyDtej7UQeiU-c9if4EKQH62j-PlS1gHTxA",

authDomain: "gamboprompts-8ff6d.firebaseapp.com",

projectId: "gamboprompts-8ff6d",

storageBucket: "gamboprompts-8ff6d.firebasestorage.app",

messagingSenderId: "92750073125",

appId: "1:92750073125:web:d29723c203a0468ecf1ecc"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

/* LOGIN */

document
.getElementById("entrar")
.addEventListener("click", async ()=>{

const whatsapp =
document.getElementById("whatsapp")
.value.trim();

const senha =
document.getElementById("senha")
.value.trim();

const erro =
document.getElementById("erro");

erro.style.display = "none";

/* VALIDAÇÃO */

if(
whatsapp === ""
||
senha === ""
){

erro.innerText =
"Preencha todos campos";

erro.style.display = "block";

return;

}

try{

const q = query(
collection(db,"usuarios"),
where("whatsapp","==",whatsapp),
where("senha","==",senha)
);

const snapshot =
await getDocs(q);

if(snapshot.empty){

erro.innerText =
"Conta não encontrada";

erro.style.display = "block";

return;

}

/* LOGIN */

localStorage.setItem(
"cliente_whatsapp",
whatsapp
);

/* REDIRECIONAR */

window.location.href =
"cliente.html";

}catch(error){

console.log(error);

erro.innerText =
"Erro ao entrar";

erro.style.display = "block";

}

});

</script>

</body>

</html>
