<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GamboPrompts</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="header">

<h1>🔥 GamboPrompts</h1>

<p>Biblioteca de Prompts IA</p>

</header>
  <div style="
display:flex;
gap:15px;
padding:20px;
flex-wrap:wrap;
">

<input
type="text"
id="pesquisa"
placeholder="Pesquisar prompts..."
style="
flex:1;
padding:15px;
border:none;
border-radius:12px;
background:#1e293b;
color:white;
font-size:16px;
"
>

<select
id="filtroCategoria"
style="
padding:15px;
border:none;
border-radius:12px;
background:#1e293b;
color:white;
font-size:16px;
"
>

<option value="">Todas Categorias</option>

</select>

</div>

<div id="prompts" class="grid"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyDtej7UQeiU-c9if4EKQH62j-PlS1gHTxA",
authDomain: "gamboprompts-8ff6d.firebaseapp.com",
projectId: "gamboprompts-8ff6d",
storageBucket: "gamboprompts-8ff6d.firebasestorage.app",
messagingSenderId: "92750073125",
appId: "1:92750073125:web:d29723c203a0468ecf1ecc"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const promptsContainer =
document.getElementById("prompts");

const pesquisaInput =
document.getElementById("pesquisa");

const filtroCategoria =
document.getElementById("filtroCategoria");

let todosPrompts = [];

async function carregarPrompts() {

try {

const querySnapshot =
await getDocs(collection(db, "prompts"));

todosPrompts = [];

querySnapshot.forEach((doc) => {

todosPrompts.push({
id: doc.id,
...doc.data()
});

});

criarCategorias();

mostrarPrompts(todosPrompts);

} catch(error) {

console.log("ERRO:", error);

}

}

function criarCategorias(){

const categorias = [
...new Set(
todosPrompts.map(p => p.categoria)
)
];

categorias.forEach((categoria) => {

filtroCategoria.innerHTML += `
<option value="${categoria}">
${categoria}
</option>
`;

});

}

function mostrarPrompts(lista){

promptsContainer.innerHTML = "";

lista.forEach((data) => {

promptsContainer.innerHTML += `

<a 
href="prompt.html?id=${data.id}" 
style="
text-decoration:none;
color:white;
"
>

<div class="card">

<img 
src="${data.imagem}" 
style="
width:100%;
height:220px;
object-fit:cover;
border-radius:12px;
margin-bottom:15px;
display:block;
"
>

<h2>${data.titulo}</h2>

<p>${data.descricao}</p>

<span>${data.categoria}</span>

</div>

</a>

`;

});

}

function filtrarPrompts(){

const pesquisa =
pesquisaInput.value.toLowerCase();

const categoria =
filtroCategoria.value;

const filtrados =
todosPrompts.filter((prompt) => {

const matchPesquisa =

prompt.titulo.toLowerCase().includes(pesquisa)

||

prompt.descricao.toLowerCase().includes(pesquisa);

const matchCategoria =

categoria === ""

||

prompt.categoria === categoria;

return matchPesquisa && matchCategoria;

});

mostrarPrompts(filtrados);

}

pesquisaInput.addEventListener(
"input",
filtrarPrompts
);

filtroCategoria.addEventListener(
"change",
filtrarPrompts
);

carregarPrompts();

</script>
</body>

</html>
