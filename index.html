<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GamboPrompts</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="header">

<h1>🔥 GamboPrompts</h1>

<p>Biblioteca de Prompts IA</p>

</header>

<!-- PESQUISA -->

<div style="
display:flex;
gap:15px;
padding:20px;
flex-wrap:wrap;
">

<input
type="text"
id="pesquisa"
placeholder="Pesquisar prompts..."
style="
flex:1;
padding:15px;
border:none;
border-radius:12px;
background:#1e293b;
color:white;
font-size:16px;
"
>

<select
id="filtroCategoria"
style="
padding:15px;
border:none;
border-radius:12px;
background:#1e293b;
color:white;
font-size:16px;
"
>

<option value="">
Todas Categorias
</option>

</select>

</div>

<!-- GRID -->

<div id="prompts" class="grid"></div>

<script type="module">

/* =========================
FIREBASE
========================= */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
updateDoc,
doc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* =========================
CONFIG
========================= */

const firebaseConfig = {

apiKey: "AIzaSyDtej7UQeiU-c9if4EKQH62j-PlS1gHTxA",

authDomain: "gamboprompts-8ff6d.firebaseapp.com",

projectId: "gamboprompts-8ff6d",

storageBucket: "gamboprompts-8ff6d.firebasestorage.app",

messagingSenderId: "92750073125",

appId: "1:92750073125:web:d29723c203a0468ecf1ecc"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

/* =========================
ELEMENTOS
========================= */

const promptsContainer =
document.getElementById("prompts");

const pesquisaInput =
document.getElementById("pesquisa");

const filtroCategoria =
document.getElementById("filtroCategoria");

/* =========================
VARIÁVEIS
========================= */

let todosPrompts = [];

/* =========================
CARREGAR PROMPTS
========================= */

async function carregarPrompts(){

try{

const querySnapshot =
await getDocs(collection(db,"prompts"));

todosPrompts = [];

querySnapshot.forEach((docItem) => {

todosPrompts.push({

id: docItem.id,
...docItem.data()

});

});

criarCategorias();

mostrarPrompts(todosPrompts);

}catch(error){

console.log(error);

}

}

/* =========================
CRIAR CATEGORIAS
========================= */

function criarCategorias(){

const categorias = [

...new Set(
todosPrompts.map(p => p.categoria)
)

];

filtroCategoria.innerHTML = `
<option value="">
Todas Categorias
</option>
`;

categorias.forEach((categoria) => {

filtroCategoria.innerHTML += `

<option value="${categoria}">
${categoria}
</option>

`;

});

}

/* =========================
MOSTRAR PROMPTS
========================= */

function mostrarPrompts(lista){

promptsContainer.innerHTML = "";

if(lista.length === 0){

promptsContainer.innerHTML = `

<p style="
color:white;
padding:20px;
font-size:18px;
">
Nenhum prompt encontrado.
</p>

`;

return;

}

lista.forEach((data) => {

promptsContainer.innerHTML += `

<div
class="card"
onclick="
window.location.href='prompt.html?id=${data.id}'
"
style="
cursor:pointer;
"
>

<img
src="${data.imagem}"
style="
width:100%;
height:220px;
object-fit:cover;
border-radius:12px;
margin-bottom:15px;
display:block;
"
>

<h2>${data.titulo}</h2>

${data.tipo === "Premium" ? `

<div style="
background:#f59e0b;
color:black;
padding:6px 12px;
border-radius:30px;
display:inline-block;
font-size:13px;
font-weight:bold;
margin-top:10px;
margin-bottom:10px;
">

PREMIUM

</div>

` : ""}

<p>

${data.tipo === "Premium"

? "🔒 Conteúdo Premium"

: data.descricao

}

</p>

<div style="
display:flex;
justify-content:space-between;
align-items:center;
margin-top:15px;
">

<span>
${data.categoria}
</span>

<button
class="like-btn"
data-id="${data.id}"
data-likes="${data.likes || 0}"
style="
background:#22c55e;
color:white;
border:none;
padding:10px 14px;
border-radius:8px;
cursor:pointer;
"
>

❤️ ${data.likes || 0}

</button>

</div>

</div>

`;

});

}

/* =========================
FILTRO
========================= */

function filtrarPrompts(){

const pesquisa =
pesquisaInput.value.toLowerCase();

const categoria =
filtroCategoria.value;

const filtrados =
todosPrompts.filter((prompt) => {

const matchPesquisa =

prompt.titulo.toLowerCase().includes(pesquisa)

||

prompt.descricao.toLowerCase().includes(pesquisa);

const matchCategoria =

categoria === ""

||

prompt.categoria === categoria;

return matchPesquisa && matchCategoria;

});

mostrarPrompts(filtrados);

}

/* =========================
EVENTOS
========================= */

pesquisaInput.addEventListener(
"input",
filtrarPrompts
);

filtroCategoria.addEventListener(
"change",
filtrarPrompts
);

/* =========================
LIKES
========================= */

document.addEventListener("click", async (e) => {

if(e.target.classList.contains("like-btn")){

e.stopPropagation();

const id =
e.target.dataset.id;

const likesAtual =
parseInt(e.target.dataset.likes);

const ref =
doc(db,"prompts",id);

await updateDoc(ref, {

likes: likesAtual + 1

});

e.target.dataset.likes =
likesAtual + 1;

e.target.innerHTML =
`❤️ ${likesAtual + 1}`;

}

});

/* =========================
START
========================= */

carregarPrompts();

</script>

</body>

</html>
