<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GamboPrompts</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
padding:20px;
}

.header{
text-align:center;
margin-bottom:30px;
}

.header h1{
font-size:40px;
margin-bottom:10px;
}

.header p{
color:#94a3b8;
font-size:18px;
}

.top-bar{
display:flex;
gap:15px;
padding:20px 0;
flex-wrap:wrap;
}

.top-bar input,
.top-bar select{
flex:1;
padding:15px;
border:none;
border-radius:12px;
background:#1e293b;
color:white;
font-size:16px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:25px;
margin-top:20px;
}

.card{
background:#1e293b;
padding:18px;
border-radius:18px;
transition:0.3s;
text-decoration:none;
color:white;
display:block;
}

.card:hover{
transform:translateY(-5px);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
border-radius:12px;
margin-bottom:15px;
display:block;
}

.card h2{
margin-bottom:12px;
font-size:22px;
}

.card p{
color:#cbd5e1;
line-height:1.5;
}

.badge{
background:#f59e0b;
color:black;
padding:6px 12px;
border-radius:30px;
display:inline-block;
font-size:13px;
font-weight:bold;
margin-top:10px;
margin-bottom:10px;
}

.card-footer{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:18px;
gap:10px;
flex-wrap:wrap;
}

.like-btn{
background:#22c55e;
color:white;
border:none;
padding:10px 14px;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

.like-btn:hover{
opacity:0.9;
}

.categoria{
background:#0f172a;
padding:8px 12px;
border-radius:10px;
font-size:14px;
}

</style>

</head>

<body>

<header class="header">

<h1>🔥 GamboPrompts</h1>

<p>Biblioteca de Prompts IA</p>

</header>

<div class="top-bar">

<input
type="text"
id="pesquisa"
placeholder="Pesquisar prompts..."
>

<select id="filtroCategoria">

<option value="">
Todas Categorias
</option>

</select>

</div>

<div id="prompts" class="grid"></div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
updateDoc,
doc,
getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE */

const firebaseConfig = {

apiKey: "AIzaSyDtej7UQeiU-c9if4EKQH62j-PlS1gHTxA",

authDomain: "gamboprompts-8ff6d.firebaseapp.com",

projectId: "gamboprompts-8ff6d",

storageBucket: "gamboprompts-8ff6d.firebasestorage.app",

messagingSenderId: "92750073125",

appId: "1:92750073125:web:d29723c203a0468ecf1ecc"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

/* ELEMENTOS */

const promptsContainer =
document.getElementById("prompts");

const pesquisaInput =
document.getElementById("pesquisa");

const filtroCategoria =
document.getElementById("filtroCategoria");

/* VARIÁVEIS */

let todosPrompts = [];

/* CARREGAR PROMPTS */

async function carregarPrompts(){

try{

const snapshot =
await getDocs(collection(db,"prompts"));

todosPrompts = [];

snapshot.forEach((docItem) => {

todosPrompts.push({
id: docItem.id,
...docItem.data()
});

});

criarCategorias();

mostrarPrompts(todosPrompts);

}catch(error){

console.log(error);

}

}

/* CRIAR CATEGORIAS */

function criarCategorias(){

const categorias = [
...new Set(
todosPrompts.map(p => p.categoria)
)
];

filtroCategoria.innerHTML = `
<option value="">
Todas Categorias
</option>
`;

categorias.forEach((categoria) => {

filtroCategoria.innerHTML += `

<option value="${categoria}">
${categoria}
</option>

`;

});

}

/* MOSTRAR PROMPTS */

function mostrarPrompts(lista){

promptsContainer.innerHTML = "";

if(lista.length === 0){

promptsContainer.innerHTML = `

<p style="
color:#94a3b8;
font-size:18px;
">
Nenhum prompt encontrado.
</p>

`;

return;

}

lista.forEach((data) => {

promptsContainer.innerHTML += `

<div class="card">

<a
href="prompt.html?id=${data.id}"
style="
text-decoration:none;
color:white;
"
>

<img
src="${data.imagem}"
>

<h2>${data.titulo}</h2>

${data.tipo === "Premium"

?

`<div class="badge">
PREMIUM
</div>`

:

""

}

<p>

${data.tipo === "Premium"

?

"🔒 Conteúdo Premium"

:

(data.descricao || "").substring(0,120) + "..."

}

</p>

</a>

<div class="card-footer">

<span class="categoria">
📂 ${data.categoria}
</span>

<button
class="like-btn"
data-id="${data.id}"
data-likes="${data.likes || 0}">
❤️ ${data.likes || 0}
</button>

</div>

</div>

`;

});

/* EVENTO LIKE */

document
.querySelectorAll(".like-btn")
.forEach((btn) => {

btn.addEventListener("click", async (e) => {

e.preventDefault();

const id =
btn.dataset.id;

const likesAtual =
parseInt(btn.dataset.likes);

const ref =
doc(db,"prompts",id);

await updateDoc(ref, {

likes: likesAtual + 1

});

btn.dataset.likes =
likesAtual + 1;

btn.innerHTML =
`❤️ ${likesAtual + 1}`;

});

});

}

/* FILTRO */

function filtrarPrompts(){

const pesquisa =
pesquisaInput.value.toLowerCase();

const categoria =
filtroCategoria.value;

const filtrados =
todosPrompts.filter((prompt) => {

const titulo =
(prompt.titulo || "")
.toLowerCase();

const descricao =
(prompt.descricao || "")
.toLowerCase();

const matchPesquisa =

titulo.includes(pesquisa)

||

descricao.includes(pesquisa);

const matchCategoria =

categoria === ""

||

prompt.categoria === categoria;

return matchPesquisa && matchCategoria;

});

mostrarPrompts(filtrados);

}

/* EVENTOS */

pesquisaInput.addEventListener(
"input",
filtrarPrompts
);

filtroCategoria.addEventListener(
"change",
filtrarPrompts
);

/* START */

carregarPrompts();

</script>

</body>

</html>
