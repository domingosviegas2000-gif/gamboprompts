<!DOCTYPE html>
<html lang="pt">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GamboPrompts</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
font-family:'Space Grotesk',sans-serif;
background:#07070C;
color:white;
overflow-x:hidden;
}

/* FUNDO */

body::before{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(
ellipse at top,
rgba(168,85,247,0.15) 0%,
transparent 50%
),

radial-gradient(
ellipse at bottom,
rgba(59,130,246,0.12) 0%,
transparent 50%
),

#07070C;

z-index:-2;
}

/* GRAIN */

body::after{
content:"";
position:fixed;
inset:0;

background-image:url(
"data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E"
);

pointer-events:none;
z-index:-1;
}

/* GLASS */

.glass{
background:rgba(28,28,36,0.6);
backdrop-filter:blur(12px);
border:1px solid rgba(45,45,58,0.8);
}

/* BOTÃO */

.gradient-btn{
background:
linear-gradient(
90deg,
#A855F7 0%,
#60A5FA 100%
);

transition:0.3s;

box-shadow:
0 0 20px rgba(168,85,247,0.4);
}

.gradient-btn:hover{
transform:translateY(-2px);

box-shadow:
0 0 30px rgba(168,85,247,0.6);
}

/* TEXTO */

.gradient-text{
background:
linear-gradient(
90deg,
#A855F7 0%,
#60A5FA 100%
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* CARD */

.card{
background:rgba(20,20,30,0.7);
backdrop-filter:blur(12px);

border:1px solid rgba(45,45,58,0.8);

transition:0.3s;
}

.card:hover{
transform:translateY(-5px);

border-color:
rgba(168,85,247,0.5);
}

/* TAG */

.tag{
background:rgba(28,28,36,0.8);
border:1px solid rgba(45,45,58,1);
transition:0.2s;
}

.tag:hover{
border-color:#A855F7;
background:rgba(168,85,247,0.1);
}

/* IMG */

.card img{
background:#0b1220;
}

/* SCROLL */

::-webkit-scrollbar{
width:8px;
height:8px;
}

::-webkit-scrollbar-thumb{
background:#A855F7;
border-radius:20px;
}

</style>

</head>

<body>

<!-- HEADER -->

<header class="sticky top-0 z-50 glass border-b border-[#2D2D3A]">

<div class="max-w-7xl mx-auto px-5 py-4 flex items-center justify-between">

<div class="flex items-center gap-3">

<div class="w-10 h-10 rounded-xl bg-gradient-to-br from-purple-500 to-blue-500 flex items-center justify-center">

✨

</div>

<h1 class="text-xl font-bold">

GamboPrompts

</h1>

</div>

<div class="flex items-center gap-3">

<a
href="login-cliente.html"
class="gradient-btn px-5 py-2 rounded-full text-black font-semibold text-sm"
>

Entrar

</a>

</div>

</div>

</header>

<!-- MAIN -->

<main class="max-w-7xl mx-auto px-5 py-12">

<!-- HERO -->

<section class="text-center mb-14">

<div class="inline-flex items-center gap-2 px-4 py-2 rounded-full glass text-sm text-gray-300 mb-6">

🚀 Biblioteca IA Cinematográfica

</div>

<h2 class="text-5xl font-bold leading-tight mb-5">

Prompts IA para gerar<br>

<span class="gradient-text">

cenas cinematográficas

</span>

</h2>

<p class="text-gray-400 text-lg max-w-2xl mx-auto">

Prompts profissionais para Midjourney, SORA, Runway, Kling, Pika Labs e geradores IA.

</p>

</section>

<!-- PESQUISA -->

<section class="mb-10">

<div class="relative max-w-3xl mx-auto">

<input
type="text"
id="pesquisa"
placeholder="Pesquisar prompts..."
class="w-full pl-6 pr-6 py-5 rounded-2xl glass text-white placeholder-gray-500 focus:outline-none"
>

</div>

</section>

<!-- CATEGORIAS -->

<section class="flex gap-3 overflow-auto pb-3 mb-12" id="categorias">

<button
class="gradient-btn px-5 py-2 rounded-full text-black font-semibold text-sm categoria-btn"
data-cat=""
>

Todos

</button>

</section>

<!-- GRID -->

<section
id="prompts"
class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"
>

</section>

</main>

<!-- FOOTER -->

<footer class="border-t border-[#2D2D3A] py-10 mt-16">

<div class="max-w-6xl mx-auto px-5 text-center">

<p class="text-gray-600 text-sm mb-4">

© 2026 GamboPrompts

</p>

<div class="flex justify-center gap-6 text-sm">

<a href="#" class="text-gray-400 hover:text-white">
Packs
</a>

<a href="#" class="text-gray-400 hover:text-white">
Afiliados
</a>

<a href="#" class="text-gray-400 hover:text-white">
Premium
</a>

</div>

</div>

</footer>

<!-- FIREBASE -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE */

const firebaseConfig = {

apiKey:"AIzaSyDtej7UQeiU-c9if4EKQH62j-PlS1gHTxA",

authDomain:"gamboprompts-8ff6d.firebaseapp.com",

projectId:"gamboprompts-8ff6d",

storageBucket:"gamboprompts-8ff6d.firebasestorage.app",

messagingSenderId:"92750073125",

appId:"1:92750073125:web:d29723c203a0468ecf1ecc"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

/* ELEMENTOS */

const promptsBox =
document.getElementById("prompts");

const pesquisa =
document.getElementById("pesquisa");

const categoriasBox =
document.getElementById("categorias");

/* VARIÁVEIS */

let prompts = [];

let categoriaAtual = "";

/* CARREGAR */

async function carregar(){

const snap =
await getDocs(
collection(db,"prompts")
);

prompts = [];

snap.forEach((doc)=>{

prompts.push({

id:doc.id,
...doc.data()

});

});

/* CATEGORIAS */

criarCategorias();

/* MOSTRAR */

mostrar(prompts);

}

/* CATEGORIAS */

function criarCategorias(){

const cats = [

...new Set(
prompts.map(
p => p.categoria
)
)

];

cats.forEach((cat)=>{

categoriasBox.innerHTML += `

<button
class="tag px-5 py-2 rounded-full text-white text-sm categoria-btn"
data-cat="${cat}"
>

${cat}

</button>

`;

});

/* EVENTO */

document
.querySelectorAll(".categoria-btn")
.forEach((btn)=>{

btn.addEventListener(
"click",
()=>{

categoriaAtual =
btn.dataset.cat;

filtrar();

});

});

}

/* MOSTRAR */

function mostrar(lista){

promptsBox.innerHTML = "";

if(lista.length === 0){

promptsBox.innerHTML = `

<div class="col-span-full text-center py-20">

<p class="text-gray-400 text-xl">

Nenhum prompt encontrado

</p>

</div>

`;

return;

}

lista.forEach((item)=>{

promptsBox.innerHTML += `

<div class="card rounded-3xl overflow-hidden p-5">

<img
src="${item.imagem}"
class="w-full h-64 object-contain rounded-2xl mb-5"
>

<div class="flex items-center justify-between mb-4">

<div class="text-xs px-3 py-1 rounded-full bg-purple-500/20 text-purple-300">

${item.categoria || 'Prompt'}

</div>

${
item.tipo === "Premium"

?

`

<div class="text-xs px-3 py-1 rounded-full bg-yellow-500/20 text-yellow-300">

PREMIUM

</div>

`

:

`

<div class="text-xs px-3 py-1 rounded-full bg-green-500/20 text-green-300">

GRÁTIS

</div>

`

}

</div>

<h2 class="text-2xl font-bold mb-3">

${item.titulo}

</h2>

<p class="text-gray-400 leading-7 mb-5">

${(item.descricao || '')
.substring(0,120)}...

</p>

<a
href="prompt.html?id=${item.id}"
class="gradient-btn w-full py-3 rounded-2xl text-black font-bold text-center block"
>

Abrir Prompt

</a>

</div>

`;

});

}

/* FILTRO */

function filtrar(){

const texto =
pesquisa.value.toLowerCase();

const filtrados =
prompts.filter((item)=>{

const titulo =
(item.titulo || "")
.toLowerCase();

const descricao =
(item.descricao || "")
.toLowerCase();

const pesquisaOk =

titulo.includes(texto)

||

descricao.includes(texto);

const categoriaOk =

categoriaAtual === ""

||

item.categoria === categoriaAtual;

return pesquisaOk && categoriaOk;

});

mostrar(filtrados);

}

/* PESQUISA */

pesquisa.addEventListener(
"input",
filtrar
);

/* START */

carregar();

</script>

</body>
</html>
