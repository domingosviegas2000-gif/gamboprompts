<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GamboPrompts</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="header">

<h1>🔥 GamboPrompts</h1>

<p>Biblioteca de Prompts IA</p>

</header>

<div id="prompts" class="grid"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyDtej7UQeiU-c9if4EKQH62j-PlS1gHTxA",
authDomain: "gamboprompts-8ff6d.firebaseapp.com",
projectId: "gamboprompts-8ff6d",
storageBucket: "gamboprompts-8ff6d.firebasestorage.app",
messagingSenderId: "92750073125",
appId: "1:92750073125:web:d29723c203a0468ecf1ecc"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const promptsContainer =
document.getElementById("prompts");

async function carregarPrompts() {

try {

const querySnapshot =
await getDocs(collection(db, "prompts"));

querySnapshot.forEach((doc) => {

const data = doc.data();

promptsContainer.innerHTML += `

<a 
href="prompt.html?id=${doc.id}" 
style="
text-decoration:none;
color:white;
"
>

<div class="card">

<img 
src="${data.imagem}" 
style="
width:100%;
height:220px;
object-fit:cover;
border-radius:12px;
margin-bottom:15px;
display:block;
"
>

<h2>${data.titulo}</h2>

<p>${data.descricao}</p>

<span>${data.categoria}</span>

</div>

</a>

`;

});

} catch(error) {

console.log("ERRO:", error);

}

}

carregarPrompts();

</script>

</body>

</html>
