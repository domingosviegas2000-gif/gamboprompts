<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GamboPrompts</title>

<style>

/* =========================
RESET
========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
padding:20px;
}

/* =========================
MENU
========================= */

.menu{
display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;
margin-bottom:25px;
}

.menu a{
background:#1e293b;
color:white;
padding:12px 18px;
border-radius:12px;
text-decoration:none;
font-weight:bold;
transition:0.3s;
}

.menu a:hover{
background:#38bdf8;
color:black;
}

/* =========================
HEADER
========================= */

.header{
text-align:center;
margin-bottom:30px;
}

.header h1{
font-size:40px;
margin-bottom:10px;
}

.header p{
color:#94a3b8;
font-size:18px;
}

/* =========================
PESQUISA
========================= */

.top-bar{
display:flex;
gap:15px;
padding:20px 0;
flex-wrap:wrap;
}

.top-bar input,
.top-bar select{
flex:1;
padding:15px;
border:none;
border-radius:12px;
background:#1e293b;
color:white;
font-size:16px;
min-width:180px;
}

/* =========================
GRID
========================= */

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:25px;
margin-top:20px;
}

/* =========================
CARD
========================= */

.card{
background:#1e293b;
padding:18px;
border-radius:20px;
transition:0.3s;
display:flex;
flex-direction:column;
height:100%;
}

.card:hover{
transform:translateY(-5px);
}

/* =========================
IMAGEM SEM CORTES
========================= */

.imagem-box{
width:100%;
background:#0f172a;
border-radius:15px;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
padding:10px;
margin-bottom:15px;
min-height:220px;
}

.imagem-box img{
width:100%;
height:auto;
max-height:500px;
object-fit:contain;
display:block;
border-radius:12px;
background:#0f172a;
}

/* =========================
TEXTOS
========================= */

.card h2{
margin-bottom:12px;
font-size:24px;
}

.card p{
color:#cbd5e1;
line-height:1.5;
}

/* =========================
PREMIUM
========================= */

.badge{
background:#f59e0b;
color:black;
padding:6px 12px;
border-radius:30px;
display:inline-block;
font-size:13px;
font-weight:bold;
margin-top:10px;
margin-bottom:10px;
}

/* =========================
RODAPÉ
========================= */

.card-footer{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:20px;
gap:10px;
flex-wrap:wrap;
}

.categoria{
background:#0f172a;
padding:8px 12px;
border-radius:10px;
font-size:14px;
}

/* =========================
LIKE
========================= */

.like-btn{
background:#22c55e;
color:white;
border:none;
padding:10px 14px;
border-radius:10px;
cursor:pointer;
font-weight:bold;
font-size:15px;
}

.like-btn:hover{
opacity:0.9;
}

/* =========================
LINK
========================= */

.link-card{
text-decoration:none;
color:white;
display:block;
height:100%;
}

/* =========================
RESPONSIVO
========================= */

@media(max-width:768px){

body{
padding:15px;
}

.grid{
grid-template-columns:1fr;
}

.imagem-box{
min-height:260px;
}

.imagem-box img{
max-height:420px;
}

.menu{
justify-content:flex-start;
overflow:auto;
}

}

@media(max-width:480px){

.imagem-box{
min-height:220px;
}

.imagem-box img{
max-height:350px;
}

.header h1{
font-size:32px;
}

}

/* =========================
SEGURANÇA IMAGEM
========================= */

img{
max-width:100%;
height:auto;
display:block;
}

</style>

</head>

<body>

<!-- MENU -->

<div class="menu">

<a href="index.html">
🏠 Início
</a>

<a href="cliente.html">
👤 Minha Conta
</a>

<a href="checkout.html">
💳 Premium
</a>

<a href="admin.html">
⚙️ Admin
</a>

</div>

<!-- HEADER -->

<header class="header">

<h1>🔥 GamboPrompts</h1>

<p>Biblioteca de Prompts IA</p>

</header>

<!-- PESQUISA -->

<div class="top-bar">

<input
type="text"
id="pesquisa"
placeholder="Pesquisar prompts..."
>

<select id="filtroCategoria">

<option value="">
Todas Categorias
</option>

</select>

</div>

<!-- GRID -->

<div id="prompts" class="grid"></div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
updateDoc,
doc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* =========================
FIREBASE
========================= */

const firebaseConfig = {

apiKey: "AIzaSyDtej7UQeiU-c9if4EKQH62j-PlS1gHTxA",

authDomain: "gamboprompts-8ff6d.firebaseapp.com",

projectId: "gamboprompts-8ff6d",

storageBucket: "gamboprompts-8ff6d.firebasestorage.app",

messagingSenderId: "92750073125",

appId: "1:92750073125:web:d29723c203a0468ecf1ecc"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

/* =========================
ELEMENTOS
========================= */

const promptsContainer =
document.getElementById("prompts");

const pesquisaInput =
document.getElementById("pesquisa");

const filtroCategoria =
document.getElementById("filtroCategoria");

/* =========================
VARIÁVEIS
========================= */

let todosPrompts = [];

/* =========================
CARREGAR PROMPTS
========================= */

async function carregarPrompts(){

try{

const snapshot =
await getDocs(collection(db,"prompts"));

todosPrompts = [];

snapshot.forEach((docItem) => {

todosPrompts.push({
id: docItem.id,
...docItem.data()
});

});

criarCategorias();

mostrarPrompts(todosPrompts);

}catch(error){

console.log(error);

}

}

/* =========================
CRIAR CATEGORIAS
========================= */

function criarCategorias(){

const categorias = [
...new Set(
todosPrompts.map(p => p.categoria)
)
];

filtroCategoria.innerHTML = `

<option value="">
Todas Categorias
</option>

`;

categorias.forEach((categoria) => {

filtroCategoria.innerHTML += `

<option value="${categoria}">
${categoria}
</option>

`;

});

}

/* =========================
MOSTRAR PROMPTS
========================= */

function mostrarPrompts(lista){

promptsContainer.innerHTML = "";

if(lista.length === 0){

promptsContainer.innerHTML = `

<p style="
color:#94a3b8;
font-size:18px;
">
Nenhum prompt encontrado.
</p>

`;

return;

}

lista.forEach((data) => {

promptsContainer.innerHTML += `

<div class="card">

<a
href="prompt.html?id=${data.id}"
class="link-card"
>

<div class="imagem-box">

<img
src="${data.imagem || 'https://via.placeholder.com/500'}"
alt="${data.titulo || 'Prompt'}"
loading="lazy"
>

</div>

<h2>${data.titulo || "Sem título"}</h2>

${data.tipo === "Premium"

?

`

<div class="badge">
PREMIUM
</div>

`

:

""

}

<p>

${data.tipo === "Premium"

?

"🔒 Conteúdo Premium"

:

((data.descricao || "").substring(0,120) + "...")

}

</p>

</a>

<div class="card-footer">

<span class="categoria">
📂 ${data.categoria || "Sem categoria"}
</span>

<button
class="like-btn"
data-id="${data.id}"
data-likes="${data.likes || 0}">
❤️ ${data.likes || 0}
</button>

</div>

</div>

`;

});

/* =========================
LIKE
========================= */

document
.querySelectorAll(".like-btn")
.forEach((btn) => {

btn.addEventListener("click", async (e) => {

e.preventDefault();

const id =
btn.dataset.id;

const likesAtual =
parseInt(btn.dataset.likes);

const ref =
doc(db,"prompts",id);

await updateDoc(ref, {

likes: likesAtual + 1

});

btn.dataset.likes =
likesAtual + 1;

btn.innerHTML =
`❤️ ${likesAtual + 1}`;

});

});

}

/* =========================
FILTRO
========================= */

function filtrarPrompts(){

const pesquisa =
pesquisaInput.value.toLowerCase();

const categoria =
filtroCategoria.value;

const filtrados =
todosPrompts.filter((prompt) => {

const titulo =
(prompt.titulo || "")
.toLowerCase();

const descricao =
(prompt.descricao || "")
.toLowerCase();

const matchPesquisa =

titulo.includes(pesquisa)

||

descricao.includes(pesquisa);

const matchCategoria =

categoria === ""

||

prompt.categoria === categoria;

return matchPesquisa && matchCategoria;

});

mostrarPrompts(filtrados);

}

/* =========================
EVENTOS
========================= */

pesquisaInput.addEventListener(
"input",
filtrarPrompts
);

filtroCategoria.addEventListener(
"change",
filtrarPrompts
);

/* =========================
START
========================= */

carregarPrompts();

</script>

</body>

</html>
