<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Área do Cliente</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
padding:20px;
}

/* MENU */

.menu{
display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;
margin-bottom:30px;
}

.menu a{
background:#1e293b;
color:white;
padding:12px 18px;
border-radius:12px;
text-decoration:none;
font-weight:bold;
transition:0.3s;
}

.menu a:hover{
background:#38bdf8;
color:black;
}

/* CONTAINER */

.container{
max-width:1200px;
margin:auto;
}

/* TOPO */

.topo{
display:flex;
justify-content:space-between;
align-items:center;
gap:20px;
flex-wrap:wrap;
margin-bottom:30px;
}

.user-box{
background:#111827;
padding:25px;
border-radius:20px;
flex:1;
min-width:280px;
}

.user-box h1{
font-size:32px;
margin-bottom:10px;
}

.user-box p{
color:#94a3b8;
font-size:17px;
}

/* STATS */

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:35px;
}

.stat{
background:#111827;
padding:25px;
border-radius:20px;
text-align:center;
}

.stat h2{
font-size:40px;
margin-bottom:10px;
color:#38bdf8;
}

.stat p{
color:#94a3b8;
font-size:16px;
}

/* GRID */

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:25px;
}

/* CARD */

.card{
background:#111827;
padding:18px;
border-radius:20px;
transition:0.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card img{
width:100%;
height:240px;
object-fit:contain;
background:#0f172a;
border-radius:15px;
padding:10px;
margin-bottom:15px;
}

.card h2{
margin-bottom:10px;
font-size:24px;
}

.card p{
color:#cbd5e1;
margin-bottom:10px;
}

/* BADGE */

.badge{
display:inline-block;
background:#f59e0b;
color:black;
padding:7px 14px;
border-radius:30px;
font-weight:bold;
margin-top:10px;
}

/* BOTÃO */

.abrir{
display:block;
width:100%;
text-align:center;
background:#38bdf8;
color:black;
padding:15px;
border-radius:12px;
text-decoration:none;
font-weight:bold;
margin-top:18px;
}

/* LOGOUT */

.logout{
background:#ef4444;
color:white;
border:none;
padding:15px 20px;
border-radius:12px;
cursor:pointer;
font-weight:bold;
font-size:16px;
}

/* VAZIO */

.vazio{
background:#111827;
padding:40px;
border-radius:20px;
text-align:center;
line-height:2;
}

/* RESPONSIVO */

@media(max-width:768px){

.topo{
flex-direction:column;
align-items:stretch;
}

.user-box h1{
font-size:28px;
}

}

</style>

</head>

<body>

<!-- MENU -->

<div class="menu">

<a href="index.html">
🏠 Início
</a>

<a href="cliente.html">
👤 Minha Conta
</a>

<a href="admin.html">
⚙️ Admin
</a>

</div>

<div class="container">

<!-- TOPO -->

<div class="topo">

<div class="user-box">

<h1>
👤 Área Premium
</h1>

<p id="numeroCliente">
Carregando...
</p>

</div>

<button
class="logout"
id="logout"
>
🚪 Sair
</button>

</div>

<!-- STATS -->

<div class="stats">

<div class="stat">

<h2 id="totalPrompts">
0
</h2>

<p>
📦 Meus Prompts
</p>

</div>

<div class="stat">

<h2>
∞
</h2>

<p>
🚀 Acesso Vitalício
</p>

</div>

<div class="stat">

<h2>
VIP
</h2>

<p>
💎 Conta Premium
</p>

</div>

</div>

<!-- PROMPTS -->

<div id="lista" class="grid"></div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
query,
where,
doc,
getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE */

const firebaseConfig = {

apiKey: "AIzaSyDtej7UQeiU-c9if4EKQH62j-PlS1gHTxA",

authDomain: "gamboprompts-8ff6d.firebaseapp.com",

projectId: "gamboprompts-8ff6d",

storageBucket: "gamboprompts-8ff6d.firebasestorage.app",

messagingSenderId: "92750073125",

appId: "1:92750073125:web:d29723c203a0468ecf1ecc"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

/* CLIENTE */

const whatsapp =
localStorage.getItem("cliente_whatsapp");

if(!whatsapp){

window.location.href =
"login-cliente.html";

}

document.getElementById("numeroCliente")
.innerText =
"📱 " + whatsapp;

/* LOGOUT */

document
.getElementById("logout")
.addEventListener("click",()=>{

localStorage.removeItem(
"cliente_whatsapp"
);

window.location.href =
"login-cliente.html";

});

/* CARREGAR */

async function carregarPrompts(){

const lista =
document.getElementById("lista");

lista.innerHTML = "";

try{

const q = query(
collection(db,"acessos"),
where("whatsapp","==",whatsapp)
);

const acessos =
await getDocs(q);

document.getElementById("totalPrompts")
.innerText =
acessos.size;

if(acessos.empty){

lista.innerHTML = `

<div class="vazio">

<h2>
📦 Nenhum Prompt
</h2>

<p style="margin-top:15px;">

Você ainda não possui prompts premium.

</p>

</div>

`;

return;

}

for(const item of acessos.docs){

const acesso = item.data();

const ref =
doc(db,"prompts",acesso.promptId);

const snap =
await getDoc(ref);

if(snap.exists()){

const data = snap.data();

lista.innerHTML += `

<div class="card">

<img
src="${data.imagem || 'https://via.placeholder.com/500'}"
>

<h2>
${data.titulo || "Sem título"}
</h2>

<p>
📂 ${data.categoria || "Sem categoria"}
</p>

<div class="badge">
💎 PREMIUM
</div>

<a
href="prompt.html?id=${snap.id}"
class="abrir"
>

🚀 Abrir Prompt

</a>

</div>

`;

}

}

}catch(error){

console.log(error);

lista.innerHTML = `

<div class="vazio">

<h2>
❌ Erro ao carregar
</h2>

</div>

`;

}

}

carregarPrompts();

</script>

</body>

</html>
