<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prompt</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
padding:20px;
}

.container{
max-width:1000px;
margin:auto;
}

img{
width:100%;
height:350px;
object-fit:cover;
border-radius:16px;
margin-bottom:25px;
}

h1{
font-size:35px;
margin-bottom:15px;
}

.badge{
display:inline-block;
padding:8px 15px;
border-radius:30px;
font-size:14px;
font-weight:bold;
margin-bottom:20px;
}

.premium{
background:#f59e0b;
color:black;
}

.free{
background:#22c55e;
color:black;
}

.meta{
display:flex;
gap:20px;
flex-wrap:wrap;
margin-bottom:25px;
color:#cbd5e1;
}

.box{
background:#111827;
padding:25px;
border-radius:16px;
margin-bottom:25px;
}

h2{
margin-bottom:15px;
}

.prompt-text{
white-space:pre-wrap;
line-height:1.7;
color:#e2e8f0;
}

.buttons{
display:flex;
gap:15px;
flex-wrap:wrap;
margin-top:25px;
}

button,
a{
padding:14px 20px;
border:none;
border-radius:10px;
font-size:15px;
font-weight:bold;
cursor:pointer;
text-decoration:none;
display:inline-block;
}

.copy-btn{
background:#38bdf8;
color:black;
}

.afiliado-btn{
background:#22c55e;
color:white;
}

.doacao-btn{
background:#f43f5e;
color:white;
}

.back{
display:inline-block;
margin-bottom:25px;
color:white;
text-decoration:none;
}

.lock{
background:#1e293b;
padding:40px;
border-radius:16px;
text-align:center;
font-size:20px;
line-height:1.8;
}

</style>

</head>

<body>

<div class="container">

<a href="index.html" class="back">
⬅
