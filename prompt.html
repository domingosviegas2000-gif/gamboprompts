<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prompt</title>

<style>

body{
background:#0f172a;
color:white;
font-family:Arial;
padding:20px;
}

.container{
max-width:1000px;
margin:auto;
}

.box{
background:#111827;
padding:20px;
border-radius:15px;
margin-bottom:20px;
}

.banner{
width:100%;
border-radius:15px;
margin-bottom:20px;
}

.lock{
background:#7f1d1d;
padding:25px;
border-radius:15px;
text-align:center;
}

button{
width:100%;
padding:16px;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
margin-top:15px;
}

.whatsapp{
background:#22c55e;
color:white;
}

.binance{
background:#f0b90b;
color:black;
}

.prompt-text{
white-space:pre-wrap;
line-height:1.8;
}

</style>

</head>

<body>

<div class="container">

<div id="conteudo"></div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
doc,
getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyDtej7UQeiU-c9if4EKQH62j-PlS1gHTxA",
authDomain: "gamboprompts-8ff6d.firebaseapp.com",
projectId: "gamboprompts-8ff6d",
storageBucket: "gamboprompts-8ff6d.firebasestorage.app",
messagingSenderId: "92750073125",
appId: "1:92750073125:web:d29723c203a0468ecf1ecc"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const params =
new URLSearchParams(window.location.search);

const id =
params.get("id");

const acessoPremium =
localStorage.getItem("acessoPremium");

const conteudo =
document.getElementById("conteudo");

async function carregarPrompt(){

const ref =
doc(db,"prompts",id);

const snap =
await getDoc(ref);

if(!snap.exists()){

conteudo.innerHTML =
"<h1>Prompt não encontrado</h1>";

return;

}

const data =
snap.data();

document.title =
data.titulo;

let html = `

<img
src="${data.imagem}"
class="banner"
>

<div class="box">

<h1>${data.titulo}</h1>

<p>
📂 ${data.categoria}
</p>

</div>

`;

if(
data.tipo === "Premium"
&&
acessoPremium !== id
){

html += `

<div class="lock">

<h2>
🔒 Prompt Premium
</h2>

<p style="
margin-top:20px;
line-height:1.8;
">

${data.prompt.substring(0,250)}...

</p>

<button
class="whatsapp"
onclick="window.open('https://wa.me/244924539161?text=Olá%20quero%20comprar%20o%20prompt:%20${encodeURIComponent(data.titulo)}')"
>

💬 Comprar via WhatsApp

</button>

<button
class="binance"
onclick="window.location.href='checkout.html?id=${id}'"
>

🟡 Comprar com Binance

</button>

</div>

`;

}else{

html += `

<div class="box">

<h2>
🧠 Prompt Completo
</h2>

<p class="prompt-text">

${data.prompt}

</p>

</div>

`;

}

conteudo.innerHTML =
html;

}

carregarPrompt();

</script>

</body>

</html>
