<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompt</title>

<style>
body{margin:0;background:#0f172a;color:#fff;font-family:Arial;padding:20px}
.container{max-width:1000px;margin:auto}
.box{background:#111827;padding:20px;border-radius:15px;margin-top:20px}
.banner{width:100%;border-radius:15px}
button{padding:15px;border:none;border-radius:10px;cursor:pointer;font-weight:bold;margin-top:10px;width:100%}
.whatsapp{background:#22c55e}
.binance{background:#f0b90b}
.express{background:#38bdf8}
.lock{background:#1e293b;padding:20px;border-radius:15px}
</style>
</head>

<body>

<div class="container" id="conteudo"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, collection, getDocs, query, where } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyD...",
authDomain: "gamboprompts-8ff6d.firebaseapp.com",
projectId: "gamboprompts-8ff6d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const id = new URLSearchParams(location.search).get("id");
const conteudo = document.getElementById("conteudo");

let promptData = null;

/* VERIFICAR COMPRA APROVADA */
async function temAcesso(){

const whatsapp = localStorage.getItem("whatsapp");

if(!whatsapp) return false;

const q = query(
collection(db,"compras"),
where("promptId","==",id),
where("whatsapp","==",whatsapp),
where("status","==","aprovado")
);

const snap = await getDocs(q);

return !snap.empty;
}

/* CARREGAR PROMPT */
async function load(){

const ref = doc(db,"prompts",id);
const snap = await getDoc(ref);

if(!snap.exists()){
conteudo.innerHTML = "Não encontrado";
return;
}

promptData = snap.data();

const acesso = await temAcesso();

conteudo.innerHTML = `

<img src="${promptData.imagem}" class="banner">

<h1>${promptData.titulo}</h1>

<div class="box">
${promptData.categoria}
</div>

<div class="box">
${promptData.instrucoes}
</div>

<div class="box">

${
(promptData.tipo === "Premium" && !acesso)
?
`
<div class="lock">

<h2>🔒 Conteúdo Premium</h2>

<p>${promptData.prompt.substring(0,200)}...</p>

<button class="whatsapp"
onclick="window.open('https://wa.me/244924539161?text=Quero%20comprar%20${promptData.titulo}')">
WhatsApp
</button>

<button class="binance"
onclick="location.href='checkout.html?id=${id}&metodo=binance'">
Binance Pay
</button>

<button class="express"
onclick="location.href='checkout.html?id=${id}&metodo=express'">
Express
</button>

</div>
`
:
`
<p>${promptData.prompt}</p>
`
}

</div>

`;

}

load();

</script>

</body>
</html>
