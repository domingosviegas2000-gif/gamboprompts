<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prompt Premium</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
font-family:'Space Grotesk',sans-serif;
background:#07070C;
color:white;
overflow-x:hidden;
}

/* FUNDO */

body::before{
content:"";
position:fixed;
inset:0;

background:

radial-gradient(
ellipse at top,
rgba(168,85,247,0.15) 0%,
transparent 50%
),

radial-gradient(
ellipse at bottom,
rgba(59,130,246,0.12) 0%,
transparent 50%
),

#07070C;

z-index:-2;
}

/* GRAIN */

body::after{
content:"";
position:fixed;
inset:0;

background-image:url(
"data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E"
);

pointer-events:none;
z-index:-1;
}

/* GLASS */

.glass{
background:rgba(28,28,36,0.6);
backdrop-filter:blur(12px);
border:1px solid rgba(45,45,58,0.8);
}

/* BOTÃO */

.gradient-btn{
background:
linear-gradient(
90deg,
#A855F7 0%,
#60A5FA 100%
);

transition:0.3s;

box-shadow:
0 0 20px rgba(168,85,247,0.4);
}

.gradient-btn:hover{
transform:translateY(-2px);

box-shadow:
0 0 30px rgba(168,85,247,0.6);
}

/* TEXTO */

.gradient-text{
background:
linear-gradient(
90deg,
#A855F7 0%,
#60A5FA 100%
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* LOCK */

.lock-box{
background:
linear-gradient(
180deg,
rgba(255,255,255,0.04),
rgba(255,255,255,0.02)
);

border:
1px solid rgba(255,255,255,0.08);
}

/* SCROLL */

::-webkit-scrollbar{
width:8px;
}

::-webkit-scrollbar-thumb{
background:#A855F7;
border-radius:20px;
}

</style>

</head>

<body>

<!-- HEADER -->

<header class="sticky top-0 z-50 glass border-b border-[#2D2D3A]">

<div class="max-w-7xl mx-auto px-5 py-4 flex items-center justify-between">

<a
href="index.html"
class="flex items-center gap-3"
>

<div class="w-10 h-10 rounded-xl bg-gradient-to-br from-purple-500 to-blue-500 flex items-center justify-center">

✨

</div>

<h1 class="text-xl font-bold">

GamboPrompts

</h1>

</a>

<a
href="cliente.html"
class="gradient-btn px-5 py-2 rounded-full text-black font-semibold text-sm"
>

Minha Conta

</a>

</div>

</header>

<!-- MAIN -->

<main
class="max-w-7xl mx-auto px-5 py-12"
>

<div id="conteudo"></div>

<!-- RELACIONADOS -->

<section class="mt-20">

<div class="flex items-center justify-between mb-8">

<h2 class="text-3xl font-bold">

🔥 Prompts Relacionados

</h2>

</div>

<div
id="relacionados"
class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"
>

</div>

</section>

</main>

<!-- FIREBASE -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
doc,
getDoc,
collection,
getDocs,
query,
where
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE */

const firebaseConfig = {

apiKey:"AIzaSyDtej7UQeiU-c9if4EKQH62j-PlS1gHTxA",

authDomain:"gamboprompts-8ff6d.firebaseapp.com",

projectId:"gamboprompts-8ff6d",

storageBucket:"gamboprompts-8ff6d.firebasestorage.app",

messagingSenderId:"92750073125",

appId:"1:92750073125:web:d29723c203a0468ecf1ecc"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

/* ELEMENTOS */

const conteudo =
document.getElementById("conteudo");

/* ID */

const params =
new URLSearchParams(
window.location.search
);

const id =
params.get("id");

/* CLIENTE */

const whatsappCliente =
localStorage.getItem(
"cliente_whatsapp"
);

/* VERIFICAR */

async function verificarAcesso(){

try{

if(!whatsappCliente){

return false;

}

const q = query(

collection(db,"acessos"),

where("promptId","==",id),

where("whatsapp","==",whatsappCliente)

);

const snapshot =
await getDocs(q);

return !snapshot.empty;

}catch(error){

console.log(error);

return false;

}

}

/* PROMPT */

async function carregarPrompt(){

try{

const ref =
doc(db,"prompts",id);

const snap =
await getDoc(ref);

if(!snap.exists()){

conteudo.innerHTML = `

<div class="text-center py-32">

<h1 class="text-4xl font-bold">

Prompt não encontrado

</h1>

</div>

`;

return;

}

const data =
snap.data();

document.title =
data.titulo || "Prompt";

const premium =
data.tipo === "Premium";

const temAcesso =
await verificarAcesso();

conteudo.innerHTML = `

<!-- HERO -->

<section class="grid lg:grid-cols-2 gap-10 items-center mb-16">

<div class="relative">

<div class="absolute inset-0 blur-[120px] bg-orange-500/20 rounded-full"></div>

<img
src="${data.imagem}"
class="relative z-10 w-full rounded-[30px] glass p-3 object-contain max-h-[650px]"
>

</div>

<div>

<div class="inline-flex items-center gap-2 px-4 py-2 rounded-full glass text-sm text-gray-300 mb-5">

✨ Prompt Premium IA

</div>

<h1 class="text-5xl font-bold leading-tight mb-6">

${data.titulo}

</h1>

<div class="flex flex-wrap gap-3 mb-8">

<div class="px-4 py-2 rounded-full bg-purple-500/20 text-purple-300 text-sm">

📂 ${data.categoria || "Prompt"}

</div>

${
premium

?

`

<div class="px-4 py-2 rounded-full bg-yellow-500/20 text-yellow-300 text-sm">

💎 PREMIUM

</div>

`

:

`

<div class="px-4 py-2 rounded-full bg-green-500/20 text-green-300 text-sm">

🟢 GRÁTIS

</div>

`

}

</div>

<p class="text-gray-400 text-lg leading-8 mb-10">

${data.descricao || "Prompt profissional IA"}

</p>

<div class="glass rounded-3xl p-6">

<h2 class="text-2xl font-bold mb-5">

📖 Instruções

</h2>

<p class="text-gray-300 leading-8 whitespace-pre-wrap">

${data.instrucoes || "Sem instruções"}

</p>

</div>

</div>

</section>

<!-- PROMPT -->

<section class="glass rounded-[35px] p-8">

<div class="flex items-center justify-between mb-8">

<h2 class="text-3xl font-bold">

🧠 Prompt

</h2>

</div>

${
premium && !temAcesso

?

`

<div class="lock-box rounded-[30px] p-8 text-center">

<div class="text-7xl mb-6">

🔒

</div>

<h2 class="text-4xl font-bold mb-5">

Prompt Premium

</h2>

<p class="text-gray-400 text-lg leading-8 max-w-2xl mx-auto mb-8">

${(data.prompt || '')
.substring(0,250)}...

</p>

<div class="glass rounded-3xl p-6 mb-8 text-left max-w-2xl mx-auto">

<h3 class="text-2xl font-bold mb-5 gradient-text">

✨ O que desbloqueia

</h3>

<ul class="space-y-4 text-gray-300">

<li>✅ Prompt completo</li>

<li>✅ Qualidade profissional</li>

<li>✅ Uso comercial</li>

<li>✅ Atualizações futuras</li>

<li>✅ Acesso vitalício</li>

<li>✅ Estratégia avançada</li>

</ul>

</div>

${
!whatsappCliente

?

`

<a
href="login-cliente.html"
class="gradient-btn w-full md:w-auto px-8 py-4 rounded-2xl text-black font-bold inline-block"
>

🔑 Entrar para desbloquear

</a>

`

:

`

<div class="flex flex-col md:flex-row gap-4 justify-center">

<a
href="checkout.html?id=${id}"
class="gradient-btn px-8 py-4 rounded-2xl text-black font-bold"
>

💳 Comprar Agora

</a>

<a
href="checkout.html?id=${id}"
class="glass px-8 py-4 rounded-2xl font-bold"
>

🟡 Binance Pay

</a>

</div>

`

}

</div>

`

:

`

<div class="glass rounded-[25px] p-8">

<pre
id="textoPrompt"
class="whitespace-pre-wrap text-gray-200 leading-8 text-lg"
>

${data.prompt || ""}

</pre>

<button
id="copiar"
class="gradient-btn mt-8 w-full py-5 rounded-2xl text-black font-bold text-lg"
>

📋 Copiar Prompt

</button>

</div>

`

}

</section>

`;

/* COPIAR */

const copiar =
document.getElementById("copiar");

if(copiar){

copiar.addEventListener(
"click",
()=>{

const texto =
document.getElementById(
"textoPrompt"
).innerText;

navigator.clipboard.writeText(
texto
);

copiar.innerText =
"✅ Copiado";

}
);

}

/* RELACIONADOS */

carregarRelacionados(
data.categoria
);

}catch(error){

console.log(error);

conteudo.innerHTML = `

<div class="text-center py-32">

<h1 class="text-4xl font-bold">

Erro ao carregar

</h1>

</div>

`;

}

}

/* RELACIONADOS */

async function carregarRelacionados(categoriaAtual){

try{

const snapshot =
await getDocs(
collection(db,"prompts")
);

const relacionados =
document.getElementById(
"relacionados"
);

relacionados.innerHTML = "";

snapshot.forEach((docItem)=>{

const data =
docItem.data();

if(
data.categoria === categoriaAtual
&&
docItem.id !== id
){

relacionados.innerHTML += `

<a
href="prompt.html?id=${docItem.id}"
class="glass rounded-[30px] overflow-hidden p-5 hover:scale-[1.02] transition-all"
>

<img
src="${data.imagem}"
class="w-full h-64 object-contain rounded-2xl mb-5 bg-[#0b1220]"
>

<h3 class="text-2xl font-bold mb-3">

${data.titulo}

</h3>

<p class="text-gray-400">

📂 ${data.categoria}

</p>

</a>

`;

}

});

}catch(error){

console.log(error);

}

}

/* START */

carregarPrompt();

</script>

</body>

</html>
