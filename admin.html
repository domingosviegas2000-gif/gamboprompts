<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel Administrativo</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#0f172a;
color:white;
padding:30px;
}

h1{
margin-bottom:25px;
}

input,
textarea,
select{
width:100%;
padding:15px;
margin-bottom:20px;
border:none;
border-radius:10px;
background:#1e293b;
color:white;
font-size:16px;
}

textarea{
resize:none;
}

.box{
background:#111827;
padding:20px;
border-radius:15px;
margin-bottom:20px;
}

h3{
margin-bottom:15px;
}

button{
width:100%;
padding:16px;
border:none;
border-radius:10px;
background:#38bdf8;
color:black;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:0.9;
}

</style>

</head>

<body>

<h1>🔥 Painel Administrativo</h1>

<input type="text"
id="titulo"
placeholder="Título do Prompt">

<textarea
id="prompt"
placeholder="Escreva o prompt completo aqui..."
style="height:250px;"></textarea>

<textarea
id="instrucoes"
placeholder="Como usar este prompt..."
style="height:180px;"></textarea>

<!-- CATEGORIA -->

<select id="categoria">

<option>Design</option>
<option>Marketing</option>
<option>Programação</option>
<option>Imagens IA</option>
<option>Vídeos IA</option>
<option>Negócios</option>

</select>

<!-- NOVA CATEGORIA -->

<input type="text"
id="novaCategoria"
placeholder="Adicionar nova categoria">

<!-- LINK AFILIADO -->

<input type="text"
id="afiliado"
placeholder="Link de afiliado">

<!-- DOAÇÕES -->

<input type="text"
id="doacao"
placeholder="Link para doações">

<!-- PACK -->

<div class="box">

<h3>Adicionar Pack de Arquivos</h3>

<input type="file" multiple>

</div>

<!-- IMAGEM -->

<div class="box">

<h3>Upload de Imagem</h3>

<input type="file" id="imagemInput">
</div>

<!-- MONETIZAÇÃO -->

<div class="box">

<h3>Monetização</h3>

<input
type="number"
id="preco"
placeholder="Preço do Prompt">

<select id="tipo">

<option>Grátis</option>
<option>Pago</option>
<option>Premium</option>

</select>

</div>

<button id="publicar">

Publicar Prompt

</button>

 <script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
getFirestore,
collection,
addDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const firebaseConfig = {
apiKey: "AIzaSyDtej7UQeiU-c9if4EKQH62j-PlS1gHTxA",
authDomain: "gamboprompts-8ff6d.firebaseapp.com",
projectId: "gamboprompts-8ff6d",
storageBucket: "gamboprompts-8ff6d.firebasestorage.app",
messagingSenderId: "92750073125",
appId: "1:92750073125:web:d29723c203a0468ecf1ecc"
};

const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

onAuthStateChanged(auth, (user) => {

if(!user){

window.location.href = "login.html";

}

});
const db = getFirestore(app);

document.getElementById("publicar").addEventListener("click", async () => {

let categoria = document.getElementById("categoria").value;

const novaCategoria = document.getElementById("novaCategoria").value;

if(novaCategoria !== ""){
categoria = novaCategoria;
}

const titulo = document.getElementById("titulo").value;
const prompt = document.getElementById("prompt").value;
const instrucoes = document.getElementById("instrucoes").value;
const afiliado = document.getElementById("afiliado").value;
const doacao = document.getElementById("doacao").value;
const preco = document.getElementById("preco").value;
const tipo = document.getElementById("tipo").value;

/* =========================
UPLOAD IMAGEM CLOUDINARY
========================= */

const imagemInput = document.getElementById("imagemInput");
const imagemFile = imagemInput.files[0];

let imagemUrl = "https://images.unsplash.com/photo-1518770660439-4636190af475?w=1200&q=80";

if(imagemFile){

const formData = new FormData();
formData.append("file", imagemFile);
formData.append("upload_preset", "gamboprompts");

const resposta = await fetch(
"https://api.cloudinary.com/v1_1/derwtydzg/image/upload",
{
method:"POST",
body:formData
}
);

const dados = await resposta.json();
imagemUrl = dados.secure_url;
}

/* =========================
SALVAR NO FIREBASE
========================= */

await addDoc(collection(db, "prompts"), {

titulo,
categoria,
prompt,
instrucoes,
afiliado,
doacao,
preco,
tipo,

descricao: prompt,
imagem: imagemUrl

});

alert("✅ Prompt publicado com sucesso!");

});

</script>

</body>

</html>
