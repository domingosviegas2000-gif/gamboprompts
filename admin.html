<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel Administrativo</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
padding:30px;
}

h1{
margin-bottom:25px;
}

input,
textarea,
select{
width:100%;
padding:15px;
margin-bottom:20px;
border:none;
border-radius:10px;
background:#1e293b;
color:white;
font-size:16px;
}

textarea{
resize:none;
}

.box{
background:#111827;
padding:20px;
border-radius:15px;
margin-bottom:20px;
}

h3{
margin-bottom:15px;
}

button{
width:100%;
padding:16px;
border:none;
border-radius:10px;
background:#38bdf8;
color:black;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:0.9;
}

#dashboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:30px;
}

.logout-btn{
width:auto;
padding:12px 20px;
margin-bottom:30px;
background:#ef4444;
color:white;
}

</style>

</head>

<body>

<h1>🔥 Painel Administrativo</h1>

<button id="logout" class="logout-btn">
🚪 Terminar Sessão
</button>

<!-- DASHBOARD -->

<div id="dashboard">

<div class="box">

<h3>Total de Prompts</h3>

<h1 id="totalPrompts">0</h1>

</div>

<div class="box">

<h3>Prompts Premium</h3>

<h1 id="totalPremium">0</h1>

</div>

<div class="box">

<h3>Categorias</h3>

<h1 id="totalCategorias">0</h1>

</div>

</div>

<!-- LISTA DE PROMPTS -->

<div class="box">

<h2 style="margin-bottom:20px;">
📚 Prompts Publicados
</h2>

<div id="listaPrompts"></div>

</div>

<!-- TÍTULO -->

<input
type="text"
id="titulo"
placeholder="Título do Prompt">

<!-- PROMPT -->

<textarea
id="prompt"
placeholder="Escreva o prompt completo aqui..."
style="height:250px;"></textarea>

<!-- INSTRUÇÕES -->

<textarea
id="instrucoes"
placeholder="Como usar este prompt..."
style="height:180px;"></textarea>

<!-- CATEGORIA -->

<select id="categoria">

<option>Design</option>
<option>Marketing</option>
<option>Programação</option>
<option>Imagens IA</option>
<option>Vídeos IA</option>
<option>Negócios</option>

</select>

<!-- NOVA CATEGORIA -->

<input
type="text"
id="novaCategoria"
placeholder="Adicionar nova categoria">

<!-- AFILIADO -->

<input
type="text"
id="afiliado"
placeholder="Link de afiliado">

<!-- DOAÇÃO -->

<input
type="text"
id="doacao"
placeholder="Link para doações">

<!-- PACK -->

<div class="box">

<h3>Adicionar Pack de Arquivos</h3>

<input type="file" multiple>

</div>

<!-- IMAGEM -->

<div class="box">

<h3>Upload de Imagem</h3>

<input type="file" id="imagemInput">

</div>

<!-- MONETIZAÇÃO -->

<div class="box">

<h3>Monetização</h3>

<input
type="number"
id="preco"
placeholder="Preço do Prompt">

<select id="tipo">

<option>Grátis</option>
<option>Pago</option>
<option>Premium</option>

</select>

</div>

<!-- BOTÃO -->

<button id="publicar">

Publicar Prompt

</button>

<script type="module">

/* =========================
FIREBASE
========================= */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
doc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* =========================
CONFIG FIREBASE
========================= */

const firebaseConfig = {

apiKey: "AIzaSyDtej7UQeiU-c9if4EKQH62j-PlS1gHTxA",

authDomain: "gamboprompts-8ff6d.firebaseapp.com",

projectId: "gamboprompts-8ff6d",

storageBucket: "gamboprompts-8ff6d.firebasestorage.app",

messagingSenderId: "92750073125",

appId: "1:92750073125:web:d29723c203a0468ecf1ecc"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

/* =========================
PROTEGER ADMIN
========================= */

onAuthStateChanged(auth, (user) => {

if(!user){

window.location.href = "login.html";

}

});

/* =========================
DASHBOARD
========================= */

async function carregarDashboard(){

const snapshot =
await getDocs(collection(db, "prompts"));

let total = 0;

let premium = 0;

const categorias = [];

snapshot.forEach((doc) => {

const data = doc.data();

total++;

if(data.tipo === "Premium"){

premium++;

}

if(!categorias.includes(data.categoria)){

categorias.push(data.categoria);

}

});

document.getElementById("totalPrompts")
.innerText = total;

document.getElementById("totalPremium")
.innerText = premium;

document.getElementById("totalCategorias")
.innerText = categorias.length;

}

carregarDashboard();

/* =========================
LISTAR PROMPTS
========================= */

async function listarPrompts(){

const snapshot =
await getDocs(collection(db, "prompts"));

const lista =
document.getElementById("listaPrompts");

lista.innerHTML = "";

snapshot.forEach((docItem) => {

const data = docItem.data();

lista.innerHTML += `

<div style="
background:#1e293b;
padding:20px;
border-radius:12px;
margin-bottom:15px;
">

<img
src="${data.imagem}"
style="
width:100%;
max-height:200px;
object-fit:cover;
border-radius:10px;
margin-bottom:10px;
">

<h3 style="margin-bottom:10px;">
${data.titulo}
</h3>

<p style="
opacity:0.8;
margin-bottom:15px;
">
${data.categoria}
</p>

<div style="
display:flex;
gap:10px;
">

<button
onclick="editarPrompt('${docItem.id}')"
style="
background:#f59e0b;
color:white;
">
✏️ Editar
</button>

<button
onclick="apagarPrompt('${docItem.id}')"
style="
background:#ef4444;
color:white;
">
🗑️ Apagar
</button>

</div>

</div>

`;

});

}

listarPrompts();

/* =========================
PUBLICAR PROMPT
========================= */

document
.getElementById("publicar")
.addEventListener("click", async () => {

try{

let categoria =
document.getElementById("categoria").value;

const novaCategoria =
document.getElementById("novaCategoria").value;

if(novaCategoria !== ""){

categoria = novaCategoria;

}

const titulo =
document.getElementById("titulo").value;

const prompt =
document.getElementById("prompt").value;

const instrucoes =
document.getElementById("instrucoes").value;

const afiliado =
document.getElementById("afiliado").value;

const doacao =
document.getElementById("doacao").value;

const preco =
document.getElementById("preco").value;

const tipo =
document.getElementById("tipo").value;

/* =========================
UPLOAD CLOUDINARY
========================= */

const imagemInput =
document.getElementById("imagemInput");

const imagemFile =
imagemInput.files[0];

let imagemUrl =
"https://images.unsplash.com/photo-1518770660439-4636190af475?w=1200&q=80";

if(imagemFile){

const formData = new FormData();

formData.append("file", imagemFile);

formData.append(
"upload_preset",
"gamboprompts"
);

const resposta = await fetch(
"https://api.cloudinary.com/v1_1/derwtydzg/image/upload",
{
method:"POST",
body:formData
}
);

const dados =
await resposta.json();

imagemUrl =
dados.secure_url;

}

/* =========================
SALVAR FIREBASE
========================= */

await addDoc(
collection(db, "prompts"),
{

titulo,
categoria,
prompt,
instrucoes,
afiliado,
doacao,
preco,
tipo,

descricao: prompt,

imagem: imagemUrl

}
);

alert("✅ Prompt publicado com sucesso!");

carregarDashboard();

listarPrompts();

}catch(error){

console.log(error);

alert("❌ Erro ao publicar");

}

});

/* =========================
APAGAR PROMPT
========================= */

window.apagarPrompt =
async function(id){

const confirmar =
confirm("Deseja apagar este prompt?");

if(!confirmar) return;

await deleteDoc(doc(db, "prompts", id));

alert("✅ Prompt apagado!");

listarPrompts();

carregarDashboard();

}

/* =========================
EDITAR PROMPT
========================= */

window.editarPrompt =
function(id){

alert(
"🚧 Sistema de edição será criado no próximo passo.\n\nID: " + id
);

}

/* =========================
LOGOUT
========================= */

document
.getElementById("logout")
.addEventListener("click", async () => {

await signOut(auth);

window.location.href = "login.html";

});

</script>

</body>

</html>
