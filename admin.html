<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel Administrativo</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
padding:25px;
}

h1{
margin-bottom:25px;
}

input,
textarea,
select{
width:100%;
padding:15px;
margin-bottom:20px;
border:none;
border-radius:10px;
background:#1e293b;
color:white;
font-size:16px;
}

textarea{
resize:none;
}

.box{
background:#111827;
padding:20px;
border-radius:15px;
margin-bottom:20px;
}

h3{
margin-bottom:15px;
}

button{
padding:14px;
border:none;
border-radius:10px;
font-size:15px;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:0.9;
}

#publicar{
width:100%;
background:#38bdf8;
color:black;
}

.logout-btn{
background:#ef4444;
color:white;
}

#dashboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:12px;
margin-bottom:20px;
}

.card img{
width:100%;
height:220px;
object-fit:cover;
border-radius:10px;
margin-bottom:15px;
}

.card-buttons{
display:flex;
gap:10px;
margin-top:15px;
}

.editar-btn{
background:#22c55e;
color:white;
flex:1;
}

.apagar-btn{
background:#ef4444;
color:white;
flex:1;
}

.categoria-item{
background:#1e293b;
padding:15px;
border-radius:10px;
margin-bottom:10px;
display:flex;
justify-content:space-between;
align-items:center;
}

.categoria-buttons{
display:flex;
gap:10px;
}

.editar-cat{
background:#f59e0b;
color:white;
}

.apagar-cat{
background:#ef4444;
color:white;
}

.add-cat{
width:100%;
background:#22c55e;
color:white;
margin-bottom:20px;
}

.top-buttons{
display:flex;
gap:15px;
flex-wrap:wrap;
margin-bottom:25px;
}

.link-btn{
background:#22c55e;
color:white;
padding:14px 20px;
border-radius:10px;
text-decoration:none;
font-weight:bold;
display:flex;
align-items:center;
}

.upload-area{
border:2px dashed #38bdf8;
padding:30px;
text-align:center;
border-radius:15px;
cursor:pointer;
background:#0f172a;
}

.upload-area:hover{
background:#172036;
}

.preview{
width:100%;
max-height:300px;
object-fit:contain;
margin-top:15px;
border-radius:10px;
display:none;
}

</style>

</head>

<body>

<h1>🔥 Painel Administrativo</h1>

<div class="top-buttons">

<button id="logout" class="logout-btn">
🚪 Terminar Sessão
</button>

<a href="compras.html" class="link-btn">
💳 Lista de Compras
</a>

</div>

<div id="dashboard">

<div class="box">
<h3>Total de Prompts</h3>
<h1 id="totalPrompts">0</h1>
</div>

<div class="box">
<h3>Prompts Premium</h3>
<h1 id="totalPremium">0</h1>
</div>

<div class="box">
<h3>Categorias</h3>
<h1 id="totalCategorias">0</h1>
</div>

<div class="box">
<h3>Clientes</h3>
<h1 id="totalClientes">0</h1>
</div>

<div class="box">
<h3>Compras</h3>
<h1 id="totalCompras">0</h1>
</div>

<div class="box">
<h3>Receita</h3>
<h1 id="receitaTotal">0 Kz</h1>
</div>

</div>

<div class="box">

<h3>📂 Gerenciar Categorias</h3>

<input
type="text"
id="novaCategoria"
placeholder="Nova categoria">

<button
id="adicionarCategoria"
class="add-cat">
➕ Adicionar Categoria
</button>

<div id="listaCategorias"></div>

</div>

<div class="box">

<h3>📚 Prompts Publicados</h3>

<div id="listaPrompts"></div>

</div>

<input
type="text"
id="titulo"
placeholder="Título do Prompt">

<textarea
id="prompt"
placeholder="Escreva o prompt..."
style="height:250px;"></textarea>

<textarea
id="instrucoes"
placeholder="Como usar..."
style="height:180px;"></textarea>

<select id="categoria"></select>

<input
type="text"
id="afiliado"
placeholder="Link afiliado">

<input
type="text"
id="doacao"
placeholder="Link doação">

<div class="box">

<h3>🖼 Upload Imagem</h3>

<div class="upload-area" id="uploadArea">
Arraste a imagem aqui ou clique para selecionar
</div>

<input
type="file"
id="imagemInput"
accept="image/*"
style="display:none">

<img
id="preview"
class="preview">

</div>

<div class="box">

<h3>💰 Monetização</h3>

<input
type="number"
id="preco"
placeholder="Preço">

<select id="tipo">

<option>Grátis</option>
<option>Pago</option>
<option>Premium</option>

</select>

</div>

<button id="publicar">
Publicar Prompt
</button>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
doc,
updateDoc,
getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyDtej7UQeiU-c9if4EKQH62j-PlS1gHTxA",
authDomain: "gamboprompts-8ff6d.firebaseapp.com",
projectId: "gamboprompts-8ff6d",
storageBucket: "gamboprompts-8ff6d.firebasestorage.app",
messagingSenderId: "92750073125",
appId: "1:92750073125:web:d29723c203a0468ecf1ecc"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

onAuthStateChanged(auth, (user) => {
if(!user){
window.location.href = "login.html";
}
});

let editandoId = null;

let categorias = [
"Design",
"Marketing",
"Programação",
"Imagens IA",
"Vídeos IA",
"Negócios"
];

const uploadArea =
document.getElementById("uploadArea");

const imagemInput =
document.getElementById("imagemInput");

const preview =
document.getElementById("preview");

uploadArea.onclick = () => imagemInput.click();

imagemInput.onchange = mostrarPreview;

function mostrarPreview(){

const file = imagemInput.files[0];

if(!file) return;

preview.src =
URL.createObjectURL(file);

preview.style.display = "block";

}

uploadArea.addEventListener("dragover",(e)=>{
e.preventDefault();
});

uploadArea.addEventListener("drop",(e)=>{
e.preventDefault();

imagemInput.files =
e.dataTransfer.files;

mostrarPreview();
});

function carregarCategorias(){

const select =
document.getElementById("categoria");

select.innerHTML = "";

categorias.forEach((cat)=>{

select.innerHTML += `
<option value="${cat}">
${cat}
</option>
`;

});

listarCategorias();

}

function listarCategorias(){

const lista =
document.getElementById("listaCategorias");

lista.innerHTML = "";

categorias.forEach((cat,index)=>{

lista.innerHTML += `

<div class="categoria-item">

<span>${cat}</span>

<div class="categoria-buttons">

<button
class="editar-cat"
onclick="editarCategoria(${index})">
✏️
</button>

<button
class="apagar-cat"
onclick="apagarCategoria(${index})">
🗑️
</button>

</div>

</div>

`;

});

}
window.editarPrompt = async function(id){

const ref = doc(db,"prompts",id);

const snap = await getDoc(ref);

const data = snap.data();

editandoId = id;

document.getElementById("titulo").value =
data.titulo || "";

document.getElementById("prompt").value =
data.prompt || "";

document.getElementById("instrucoes").value =
data.instrucoes || "";

document.getElementById("categoria").value =
data.categoria || "";

document.getElementById("afiliado").value =
data.afiliado || "";

document.getElementById("doacao").value =
data.doacao || "";

document.getElementById("preco").value =
data.preco || "";

document.getElementById("tipo").value =
data.tipo || "Grátis";

if(data.imagem){

preview.src = data.imagem;

preview.style.display = "block";

}

document.getElementById("publicar")
.innerText = "Atualizar Prompt";

window.scrollTo({
top:0,
behavior:"smooth"
});

}

window.apagarPrompt = async function(id){

const confirmar =
confirm("Deseja apagar?");

if(!confirmar) return;

await deleteDoc(
doc(db,"prompts",id)
);

listarPrompts();

carregarDashboard();

}

async function carregarDashboard(){

const snapshot =
await getDocs(
collection(db,"prompts")
);

let total = 0;
let premium = 0;

const cats = [];

snapshot.forEach((docItem)=>{

const data = docItem.data();

total++;

if(data.tipo === "Premium"){
premium++;
}

if(
!cats.includes(
data.categoria
)
){
cats.push(
data.categoria
);
}

});

document.getElementById(
"totalPrompts"
).innerText = total;

document.getElementById(
"totalPremium"
).innerText = premium;

document.getElementById(
"totalCategorias"
).innerText = cats.length;

}

async function listarPrompts(){

const snapshot =
await getDocs(
collection(db,"prompts")
);

const lista =
document.getElementById(
"listaPrompts"
);

lista.innerHTML = "";

snapshot.forEach((docItem)=>{

const data =
docItem.data();

lista.innerHTML += `

<div class="card">

<img src="${data.imagem}">

<h2>${data.titulo}</h2>

<p style="margin-top:10px;">
📂 ${data.categoria}
</p>

<p style="margin-top:10px;">
❤️ ${data.likes || 0} Likes
</p>

<div class="card-buttons">

<button
class="editar-btn"
onclick="editarPrompt('${docItem.id}')">
✏️ Editar
</button>

<button
class="apagar-btn"
onclick="apagarPrompt('${docItem.id}')">
🗑️ Apagar
</button>
const comprasSnap =
await getDocs(collection(db,"acessos"));

let clientes = [];
let totalCompras = 0;
let receita = 0;

comprasSnap.forEach((docItem)=>{

const compra = docItem.data();

totalCompras++;

if(compra.whatsapp){

if(!clientes.includes(compra.whatsapp)){

clientes.push(compra.whatsapp);

}

}

receita += Number(compra.valor || 0);

});

document.getElementById("totalClientes")
.innerText = clientes.length;

document.getElementById("totalCompras")
.innerText = totalCompras;

document.getElementById("receitaTotal")
.innerText =
receita.toLocaleString() + " Kz";

</div>

</div>

`;

});

}

document
.getElementById("publicar")
.addEventListener(
"click",
async ()=>{

try{

const titulo =
document.getElementById("titulo").value;

const promptText =
document.getElementById("prompt").value;

const instrucoes =
document.getElementById("instrucoes").value;

const categoria =
document.getElementById("categoria").value;

const afiliado =
document.getElementById("afiliado").value;

const doacao =
document.getElementById("doacao").value;

const preco =
document.getElementById("preco").value;

const tipo =
document.getElementById("tipo").value;

const imagemFile =
imagemInput.files[0];

let imagemUrl = null;

if(imagemFile){

const formData =
new FormData();

formData.append(
"file",
imagemFile
);

formData.append(
"upload_preset",
"gamboprompts"
);

const resposta =
await fetch(
"https://api.cloudinary.com/v1_1/derwtydzg/image/upload",
{
method:"POST",
body:formData
}
);

const dados =
await resposta.json();

imagemUrl =
dados.secure_url;

}

if(editandoId){

const ref =
doc(
db,
"prompts",
editandoId
);

const snap =
await getDoc(ref);

const atual =
snap.data();

await updateDoc(ref,{

titulo,

prompt: promptText,

descricao: promptText,

instrucoes,

categoria,

afiliado,

doacao,

preco,

tipo,

likes:
atual.likes || 0,

imagem:
imagemUrl ||
atual.imagem

});

editandoId = null;

document.getElementById(
"publicar"
).innerText =
"Publicar Prompt";

alert(
"✅ Atualizado"
);

}else{

await addDoc(
collection(
db,
"prompts"
),
{

titulo,

prompt: promptText,

descricao: promptText,

instrucoes,

categoria,

afiliado,

doacao,

preco,

tipo,

likes:0,

imagem:
imagemUrl ||
"https://images.unsplash.com/photo-1518770660439-4636190af475?w=1200&q=80"

}
);

alert(
"✅ Publicado"
);

}

document.getElementById(
"titulo"
).value = "";

document.getElementById(
"prompt"
).value = "";

document.getElementById(
"instrucoes"
).value = "";

document.getElementById(
"afiliado"
).value = "";

document.getElementById(
"doacao"
).value = "";

document.getElementById(
"preco"
).value = "";

imagemInput.value = "";

preview.style.display =
"none";

listarPrompts();

carregarDashboard();

}catch(error){

console.log(error);

alert("Erro");

}

});

document
.getElementById("logout")
.addEventListener(
"click",
async ()=>{

await signOut(auth);

window.location.href =
"login.html";

});

carregarCategorias();

listarPrompts();

carregarDashboard();

</script>

</body>

</html>
