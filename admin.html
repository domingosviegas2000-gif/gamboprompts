<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GamboPrompts Admin PRO 2.0</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#0f172a;
    color:white;
}

.container{
    max-width:1400px;
    margin:auto;
    padding:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
}

input,textarea,select{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:#334155;
    color:white;
    box-sizing:border-box;
}

button{
    background:#3b82f6;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
    margin-top:10px;
    font-weight:bold;
}

button:hover{
    background:#2563eb;
}

.delete{
    background:#ef4444;
}

.edit{
    background:#f59e0b;
}

.premium{
    color:gold;
    font-weight:bold;
}

.prompt-card{
    background:#334155;
    padding:15px;
    border-radius:15px;
    margin-top:15px;
}

img{
    width:100%;
    border-radius:10px;
    margin-top:10px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.stats{
    background:#1e293b;
    padding:20px;
    border-radius:15px;
    text-align:center;
}

.hidden{
    display:none;
}

</style>

</head>

<body>

<div class="container">

<div class="topbar">
<h1>🔥 GamboPrompts Admin PRO 2.0</h1>

<button onclick="exportPrompts()">
Exportar JSON
</button>
</div>

<div class="grid">

<div class="stats">
<h2 id="totalPrompts">0</h2>
<p>Prompts</p>
</div>

<div class="stats">
<h2 id="premiumCount">0</h2>
<p>Premium</p>
</div>

<div class="stats">
<h2>Adsense</h2>
<p>Ativo</p>
</div>

<div class="stats">
<h2>PRO</h2>
<p>Painel</p>
</div>

</div>

<div class="card">

<h2>Adicionar / Editar Prompt</h2>

<input type="hidden" id="editIndex">

<input type="text" id="title"
placeholder="Título do Prompt">

<textarea id="prompt"
placeholder="Conteúdo do Prompt"></textarea>

<textarea id="instructions"
placeholder="Como usar este prompt"></textarea>

<input type="text" id="image"
placeholder="URL da imagem">

<select id="category">

<option>ChatGPT</option>
<option>Midjourney</option>
<option>Marketing</option>
<option>Trading</option>
<option>Negócios</option>
<option>TikTok</option>
<option>Automação</option>

</select>

<select id="premium">

<option value="false">Grátis</option>
<option value="true">Premium</option>

</select>

<input type="text" id="tags"
placeholder="Tags separadas por vírgula">

<button onclick="savePrompt()">
Salvar Prompt
</button>

</div>

<div class="card">

<h2>Monetização</h2>

<input type="text" id="gumroad"
placeholder="Link Gumroad">

<input type="text" id="kofi"
placeholder="Link Ko-fi">

<input type="text" id="affiliate"
placeholder="Link Afiliado">

<textarea id="adsense"
placeholder="Código Adsense"></textarea>

<button onclick="saveMonetization()">
Salvar Monetização
</button>

</div>

<div class="card">

<h2>Newsletter Premium</h2>

<input type="text"
placeholder="Link Beehiiv">

<input type="text"
placeholder="Link ConvertKit">

<button>
Salvar Newsletter
</button>

</div>

<div class="card">

<h2>Configurações do Site</h2>

<input type="text"
placeholder="Nome do site">

<input type="text"
placeholder="Logo URL">

<input type="text"
placeholder="Cor principal">

<button>
Salvar Configurações
</button>

</div>

<div class="card">

<h2>Lista de Prompts</h2>

<div id="promptList"></div>

</div>

</div>

<script>

let prompts =
JSON.parse(localStorage.getItem("prompts")) || [];

function updateDashboard(){

document.getElementById("totalPrompts")
.innerText = prompts.length;

const premium =
prompts.filter(p=>p.premium==="true");

document.getElementById("premiumCount")
.innerText = premium.length;

}

function savePrompt(){

const title =
document.getElementById("title").value;

const prompt =
document.getElementById("prompt").value;

const instructions =
document.getElementById("instructions").value;

const image =
document.getElementById("image").value;

const category =
document.getElementById("category").value;

const premium =
document.getElementById("premium").value;

const tags =
document.getElementById("tags").value;

const editIndex =
document.getElementById("editIndex").value;

const data = {

title,
prompt,
instructions,
image,
category,
premium,
tags

};

if(editIndex===""){

prompts.push(data);

}else{

prompts[editIndex] = data;

}

localStorage.setItem(
"prompts",
JSON.stringify(prompts)
);

clearForm();

renderPrompts();

}

function renderPrompts(){

const list =
document.getElementById("promptList");

list.innerHTML = "";

prompts.forEach((p,index)=>{

list.innerHTML += `

<div class="prompt-card">

<h2>${p.title}</h2>

<p>${p.prompt}</p>

<h4>Como usar:</h4>

<p>${p.instructions}</p>

<img src="${p.image}">

<p><b>Categoria:</b> ${p.category}</p>

<p><b>Tags:</b> ${p.tags}</p>

${
p.premium==="true"
? "<p class='premium'>PREMIUM</p>"
: "<p>GRÁTIS</p>"
}

<button class="edit"
onclick="editPrompt(${index})">
Editar
</button>

<button class="delete"
onclick="deletePrompt(${index})">
Apagar
</button>

</div>

`;

});

updateDashboard();

}

function editPrompt(index){

const p = prompts[index];

document.getElementById("editIndex")
.value = index;

document.getElementById("title")
.value = p.title;

document.getElementById("prompt")
.value = p.prompt;

document.getElementById("instructions")
.value = p.instructions;

document.getElementById("image")
.value = p.image;

document.getElementById("category")
.value = p.category;

document.getElementById("premium")
.value = p.premium;

document.getElementById("tags")
.value = p.tags;

window.scrollTo({
top:0,
behavior:"smooth"
});

}

function deletePrompt(index){

if(confirm("Apagar prompt?")){

prompts.splice(index,1);

localStorage.setItem(
"prompts",
JSON.stringify(prompts)
);

renderPrompts();

}

}

function clearForm(){

document.getElementById("editIndex")
.value = "";

document.getElementById("title")
.value = "";

document.getElementById("prompt")
.value = "";

document.getElementById("instructions")
.value = "";

document.getElementById("image")
.value = "";

document.getElementById("tags")
.value = "";

}

function exportPrompts(){

const dataStr =
JSON.stringify(prompts,null,2);

const blob =
new Blob([dataStr],
{type:"application/json"});

const url =
URL.createObjectURL(blob);

const a =
document.createElement("a");

a.href = url;

a.download = "prompts.json";

a.click();

}

function saveMonetization(){

const monetization = {

gumroad:
document.getElementById("gumroad").value,

kofi:
document.getElementById("kofi").value,

affiliate:
document.getElementById("affiliate").value,

adsense:
document.getElementById("adsense").value

};

localStorage.setItem(
"monetization",
JSON.stringify(monetization)
);

alert("Monetização salva");

}

renderPrompts();

</script>

</body>
</html>
