<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GamboPrompts Admin</title>

<style>

body{
background:#0f172a;
color:white;
font-family:Arial;
padding:20px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:12px;
max-width:700px;
margin:auto;
}

input,textarea{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
background:#334155;
color:white;
}

button{
padding:12px 20px;
background:#3b82f6;
border:none;
border-radius:8px;
color:white;
font-weight:bold;
margin-top:10px;
cursor:pointer;
}

.prompt{
background:#334155;
padding:15px;
border-radius:10px;
margin-top:15px;
}

</style>

</head>

<body>

<div class="card">

<h1>🔥 GamboPrompts Admin</h1>

<input id="title" placeholder="Título">

<textarea id="prompt" placeholder="Prompt"></textarea>

<button onclick="savePrompt()">
Salvar Prompt
</button>

<div id="list"></div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyBX3X9rq_-JALXfUhZscA97ef50DJLXa2w",

authDomain: "gamboprompts.firebaseapp.com",

projectId: "gamboprompts",

storageBucket: "gamboprompts.firebasestorage.app",

messagingSenderId: "582015637499",

appId: "1:582015637499:web:5342fb4c0e01b6b8c9dd5e"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const list = document.getElementById("list");

async function loadPrompts(){

list.innerHTML = "Carregando...";

const querySnapshot =
await getDocs(collection(db,"gambo_prompts"));

list.innerHTML = "";

querySnapshot.forEach((doc)=>{

const data = doc.data();

list.innerHTML += `

<div class="prompt">

<h3>${data.title || ""}</h3>

<p>${data.prompt || ""}</p>

</div>

`;

});

}

window.savePrompt = async function(){

const title =
document.getElementById("title").value;

const prompt =
document.getElementById("prompt").value;

if(!title || !prompt){

alert("Preencha tudo");

return;

}

await addDoc(
collection(db,"gambo_prompts"),
{
title,
prompt,
createdAt:Date.now()
}
);

alert("Prompt salvo online");

document.getElementById("title").value = "";
document.getElementById("prompt").value = "";

loadPrompts();

}

loadPrompts();

</script>

</body>
</html>
