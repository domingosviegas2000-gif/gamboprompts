<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin - GamboPrompts</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#07070C;
background-image:
radial-gradient(circle at top,
rgba(249,115,22,0.15),
transparent 40%),
radial-gradient(circle at bottom,
rgba(168,85,247,0.15),
transparent 40%);
color:white;
padding:20px;
}

/* GLASS */

.glass{
background:rgba(17,24,39,0.65);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,0.06);
}

/* TEXT */

.gradient-text{
background:linear-gradient(
90deg,
#f97316,
#ef4444,
#a855f7,
#60a5fa
);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* BUTTON */

.gradient-btn{
background:linear-gradient(
90deg,
#f97316,
#ef4444,
#a855f7,
#60a5fa
);
color:white;
border:none;
}

/* HEADER */

.header{
padding:18px 25px;
border-radius:25px;
margin-bottom:35px;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:20px;
}

.logo{
display:flex;
align-items:center;
gap:15px;
}

.logo-icon{
width:45px;
height:45px;
border-radius:15px;
background:linear-gradient(
135deg,
#f97316,
#ef4444,
#a855f7
);
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
font-weight:bold;
}

.logo h1{
font-size:26px;
}

.menu{
display:flex;
gap:12px;
flex-wrap:wrap;
}

.menu a{
padding:12px 18px;
border-radius:14px;
text-decoration:none;
color:white;
font-weight:bold;
background:#111827;
}

/* HERO */

.hero{
padding:40px;
border-radius:30px;
margin-bottom:30px;
}

.hero h2{
font-size:50px;
margin-bottom:15px;
}

.hero p{
color:#94a3b8;
font-size:18px;
}

/* STATS */

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:35px;
}

.stat{
padding:30px;
border-radius:25px;
}

.stat h2{
font-size:42px;
margin-bottom:10px;
}

.stat p{
color:#94a3b8;
}

/* FORM */

.form-box{
padding:30px;
border-radius:30px;
margin-bottom:35px;
}

.form-box h2{
margin-bottom:25px;
font-size:30px;
}

.grid-form{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

input,
textarea,
select{
width:100%;
padding:16px;
border:none;
border-radius:16px;
background:#111827;
color:white;
font-size:16px;
}

textarea{
min-height:160px;
resize:vertical;
}

button{
padding:16px;
border:none;
border-radius:16px;
cursor:pointer;
font-weight:bold;
font-size:16px;
}

/* LISTA */

.lista{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:25px;
}

/* CARD */

.card{
padding:18px;
border-radius:25px;
position:relative;
}

.card img{
width:100%;
height:230px;
object-fit:contain;
background:#0b1220;
border-radius:18px;
padding:10px;
margin-bottom:15px;
}

.card h3{
font-size:24px;
margin-bottom:10px;
}

.card p{
color:#cbd5e1;
line-height:1.6;
margin-bottom:10px;
}

/* BADGE */

.badge{
display:inline-block;
padding:7px 14px;
border-radius:30px;
font-weight:bold;
margin-bottom:12px;
font-size:14px;
}

.premium{
background:#f59e0b;
color:black;
}

.gratis{
background:#22c55e;
color:white;
}

/* ACTIONS */

.actions{
display:flex;
gap:12px;
margin-top:20px;
}

.editar{
background:#3b82f6;
color:white;
flex:1;
}

.excluir{
background:#ef4444;
color:white;
flex:1;
}

/* RESPONSIVO */

@media(max-width:768px){

.hero h2{
font-size:36px;
}

.lista{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<!-- HEADER -->

<header class="header glass">

<div class="logo">

<div class="logo-icon">

🔥

</div>

<h1>GamboPrompts</h1>

</div>

<div class="menu">

<a href="index.html">
Início
</a>

<a href="cliente.html">
Biblioteca
</a>

<a href="admin.html"
class="gradient-btn">
Admin
</a>

</div>

</header>

<!-- HERO -->

<section class="hero glass">

<h2 class="gradient-text">

Painel Administrativo

</h2>

<p>

Gerencie prompts, categorias, imagens e acessos premium.

</p>

</section>

<!-- STATS -->

<section class="stats">

<div class="stat glass">

<h2
id="totalPrompts"
class="gradient-text"
>

0

</h2>

<p>

Total Prompts

</p>

</div>

<div class="stat glass">

<h2
id="totalPremium"
class="gradient-text"
>

0

</h2>

<p>

Premium

</p>

</div>

<div class="stat glass">

<h2
id="totalGratis"
class="gradient-text"
>

0

</h2>

<p>

Grátis

</p>

</div>

</section>

<!-- FORM -->

<section class="form-box glass">

<h2>

Adicionar Prompt

</h2>

<div class="grid-form">

<input
type="text"
id="titulo"
placeholder="Título"
>

<input
type="text"
id="categoria"
placeholder="Categoria"
>

<input
type="text"
id="imagem"
placeholder="URL da imagem"
>

<select id="tipo">

<option value="Grátis">

Grátis

</option>

<option value="Premium">

Premium

</option>

</select>

</div>

<textarea
id="descricao"
placeholder="Descrição"
></textarea>

<textarea
id="instrucoes"
placeholder="Instruções"
></textarea>

<textarea
id="prompt"
placeholder="Prompt completo"
></textarea>

<button
id="salvar"
class="gradient-btn"
style="
width:100%;
margin-top:20px;
"
>

Salvar Prompt

</button>

</section>

<!-- LISTA -->

<section
id="lista"
class="lista"
>

</section>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
doc

}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE */

const firebaseConfig = {

apiKey: "AIzaSyDtej7UQeiU-c9if4EKQH62j-PlS1gHTxA",

authDomain: "gamboprompts-8ff6d.firebaseapp.com",

projectId: "gamboprompts-8ff6d",

storageBucket: "gamboprompts-8ff6d.firebasestorage.app",

messagingSenderId: "92750073125",

appId: "1:92750073125:web:d29723c203a0468ecf1ecc"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

/* LISTA */

const lista =
document.getElementById("lista");

/* SALVAR */

document
.getElementById("salvar")
.addEventListener("click",
async()=>{

const titulo =
document.getElementById("titulo").value;

const categoria =
document.getElementById("categoria").value;

const imagem =
document.getElementById("imagem").value;

const tipo =
document.getElementById("tipo").value;

const descricao =
document.getElementById("descricao").value;

const instrucoes =
document.getElementById("instrucoes").value;

const prompt =
document.getElementById("prompt").value;

if(
titulo === ""
||
prompt === ""
){

alert("Preencha os campos");

return;

}

await addDoc(
collection(db,"prompts"),
{

titulo,
categoria,
imagem,
tipo,
descricao,
instrucoes,
prompt,
likes:0

}
);

alert("Prompt salvo");

location.reload();

});

/* CARREGAR */

async function carregar(){

lista.innerHTML = "";

const snapshot =
await getDocs(
collection(db,"prompts")
);

let premium = 0;
let gratis = 0;

document.getElementById(
"totalPrompts"
).innerText =
snapshot.size;

snapshot.forEach((docItem)=>{

const data =
docItem.data();

if(data.tipo === "Premium"){

premium++;

}else{

gratis++;

}

lista.innerHTML += `

<div class="card glass">

<img
src="${data.imagem || 'https://via.placeholder.com/500'}"
>

<div class="
badge
${data.tipo === 'Premium'
? 'premium'
: 'gratis'}
">

${data.tipo}

</div>

<h3>

${data.titulo}

</h3>

<p>

${data.descricao || 'Sem descrição'}

</p>

<div class="actions">

<button
class="editar"
onclick="
window.location.href=
'editar.html?id=${docItem.id}'
"
>

Editar

</button>

<button
class="excluir"
onclick="excluirPrompt('${docItem.id}')"
>

Excluir

</button>

</div>

</div>

`;

});

document.getElementById(
"totalPremium"
).innerText =
premium;

document.getElementById(
"totalGratis"
).innerText =
gratis;

}

/* EXCLUIR */

window.excluirPrompt =
async(id)=>{

const confirmar =
confirm("Excluir prompt?");

if(!confirmar){

return;

}

await deleteDoc(
doc(db,"prompts",id)
);

location.reload();

};

/* START */

carregar();

</script>

</body>

</html>
