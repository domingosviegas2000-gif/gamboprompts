<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin SaaS Completo</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

header{
  background:#111827;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.container{padding:20px;}

.section{
  background:#111827;
  padding:15px;
  margin-top:20px;
  border-radius:10px;
}

button{
  padding:8px 12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  margin:5px;
}

.primary{background:#3b82f6;color:white;}
.danger{background:#ef4444;color:white;}

.item{
  background:#1f2937;
  padding:10px;
  margin-top:10px;
  display:flex;
  justify-content:space-between;
  border-radius:8px;
}
</style>
</head>

<body>

<header>
  <h3>🔥 Admin SaaS</h3>
  <button class="danger" id="logoutBtn">Sair</button>
</header>

<div class="container">

<!-- DASHBOARD -->
<div class="section">
  <h3>📊 Dashboard</h3>
  <p>Total Prompts: <span id="totalPrompts">0</span></p>
  <p>Premium: <span id="totalPremium">0</span></p>
  <p>Categorias: <span id="totalCategories">0</span></p>
</div>

<!-- CATEGORIAS -->
<div class="section">
  <h3>📂 Categorias</h3>
  <button class="primary" onclick="addCategory()">+ Criar Categoria</button>
  <div id="categories"></div>
</div>

<!-- PROMPTS -->
<div class="section">
  <h3>📚 Prompts</h3>
  <button class="primary" onclick="addPrompt()">+ Criar Prompt</button>
  <div id="prompts"></div>
</div>

<!-- MONETIZAÇÃO (BASE FUTURA) -->
<div class="section">
  <h3>💰 Monetização</h3>
  <p>Sistema preparado para:</p>
  <ul>
    <li>Grátis</li>
    <li>Pago</li>
    <li>Premium (bloqueio futuro)</li>
  </ul>
</div>

</div>

<script type="module">

// ================= FIREBASE =================
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  deleteDoc,
  doc,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

import {
  getAuth,
  signOut,
  onAuthStateChanged,
  setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

// ================= CONFIG =================
const firebaseConfig = {
  apiKey: "SUA_API",
  authDomain: "SEU_AUTH",
  projectId: "SEU_PROJECT",
  storageBucket: "SEU_BUCKET",
  messagingSenderId: "SEU_ID",
  appId: "SEU_APP"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

// persistência login
await setPersistence(auth, browserLocalPersistence);

// ================= AUTH =================
onAuthStateChanged(auth,(user)=>{
  if(!user){
    window.location.href="login.html";
  }
});

// logout
document.getElementById("logoutBtn").addEventListener("click", async ()=>{
  await signOut(auth);
  window.location.href="login.html";
});

// ================= CATEGORIAS =================
const catRef = collection(db,"categories");

onSnapshot(catRef,(snap)=>{
  document.getElementById("totalCategories").innerText = snap.size;

  let html="";
  snap.forEach(d=>{
    html += `
      <div class="item">
        <span>${d.data().name}</span>
        <button class="danger" onclick="deleteCategory('${d.id}')">Apagar</button>
      </div>
    `;
  });

  document.getElementById("categories").innerHTML = html;
});

// ================= PROMPTS =================
const promptRef = collection(db,"prompts");

onSnapshot(promptRef,(snap)=>{
  document.getElementById("totalPrompts").innerText = snap.size;

  let premiumCount = 0;
  let html="";

  snap.forEach(d=>{
    let data = d.data();
    if(data.type === "premium") premiumCount++;

    html += `
      <div class="item">
        <span>${data.title} (${data.type})</span>
        <button class="danger" onclick="deletePrompt('${d.id}')">Apagar</button>
      </div>
    `;
  });

  document.getElementById("prompts").innerHTML = html;
  document.getElementById("totalPremium").innerText = premiumCount;
});

// ================= CRUD =================
window.addCategory = async ()=>{
  let name = prompt("Nome da categoria:");
  if(!name) return;

  await addDoc(collection(db,"categories"),{
    name,
    createdAt:Date.now()
  });
};

window.deleteCategory = async (id)=>{
  await deleteDoc(doc(db,"categories",id));
};

window.addPrompt = async ()=>{
  let title = prompt("Título:");
  let type = prompt("Tipo (free/paid/premium):","free");
  if(!title) return;

  await addDoc(collection(db,"prompts"),{
    title,
    type,
    createdAt:Date.now()
  });
};

window.deletePrompt = async (id)=>{
  await deleteDoc(doc(db,"prompts",id));
};

</script>

</body>
</html>
