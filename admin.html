<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel Administrativo</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
padding:25px;
}

h1{
margin-bottom:25px;
}

input,
textarea,
select{
width:100%;
padding:15px;
margin-bottom:20px;
border:none;
border-radius:10px;
background:#1e293b;
color:white;
font-size:16px;
}

textarea{
resize:none;
}

.box{
background:#111827;
padding:20px;
border-radius:15px;
margin-bottom:20px;
}

h3{
margin-bottom:15px;
}

button{
padding:14px;
border:none;
border-radius:10px;
font-size:15px;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:0.9;
}

#publicar{
width:100%;
background:#38bdf8;
color:black;
}

.logout-btn{
background:#ef4444;
color:white;
margin-bottom:25px;
}

#dashboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:12px;
margin-bottom:20px;
}

.card img{
width:100%;
height:220px;
object-fit:cover;
border-radius:10px;
margin-bottom:15px;
}

.card-buttons{
display:flex;
gap:10px;
margin-top:15px;
}

.editar-btn{
background:#22c55e;
color:white;
flex:1;
}

.apagar-btn{
background:#ef4444;
color:white;
flex:1;
}

.categoria-item{
background:#1e293b;
padding:15px;
border-radius:10px;
margin-bottom:10px;
display:flex;
justify-content:space-between;
align-items:center;
}

.categoria-buttons{
display:flex;
gap:10px;
}

.editar-cat{
background:#f59e0b;
color:white;
}

.apagar-cat{
background:#ef4444;
color:white;
}

.add-cat{
width:100%;
background:#22c55e;
color:white;
margin-bottom:20px;
}

.comp-img{
width:100%;
max-height:300px;
object-fit:contain;
background:#0f172a;
padding:10px;
border-radius:10px;
margin-top:15px;
}

.status{
margin-top:10px;
font-weight:bold;
}

.pendente{
color:#f59e0b;
}

.aprovado{
color:#22c55e;
}

</style>

</head>

<body>

<h1>🔥 Painel Administrativo</h1>

<div style="
display:flex;
gap:15px;
flex-wrap:wrap;
margin-bottom:25px;
">

<button id="logout" class="logout-btn">
🚪 Terminar Sessão
</button>

<a
href="compras.html"
style="
background:#22c55e;
color:white;
padding:14px 20px;
border-radius:10px;
text-decoration:none;
font-weight:bold;
display:flex;
align-items:center;
">

💳 Lista de Compras

</a>

</div>

<!-- DASHBOARD -->

<div id="dashboard">

<div class="box">
<h3>Total de Prompts</h3>
<h1 id="totalPrompts">0</h1>
</div>

<div class="box">
<h3>Prompts Premium</h3>
<h1 id="totalPremium">0</h1>
</div>

<div class="box">
<h3>Categorias</h3>
<h1 id="totalCategorias">0</h1>
</div>

</div>

<!-- COMPRAS -->

<div class="box">

<h3>💳 Compras Recebidas</h3>

<div id="listaCompras"></div>

</div>

<!-- CATEGORIAS -->

<div class="box">

<h3>📂 Gerenciar Categorias</h3>

<input
type="text"
id="novaCategoria"
placeholder="Nova categoria">

<button
id="adicionarCategoria"
class="add-cat">
➕ Adicionar Categoria
</button>

<div id="listaCategorias"></div>

</div>

<!-- PROMPTS -->

<div class="box">

<h3>📚 Prompts Publicados</h3>

<div id="listaPrompts"></div>

</div>

<!-- FORM -->

<input
type="text"
id="titulo"
placeholder="Título do Prompt">

<textarea
id="prompt"
placeholder="Escreva o prompt..."
style="height:250px;"></textarea>

<textarea
id="instrucoes"
placeholder="Como usar..."
style="height:180px;"></textarea>

<select id="categoria"></select>

<input
type="text"
id="afiliado"
placeholder="Link afiliado">

<input
type="text"
id="doacao"
placeholder="Link doação">

<div class="box">

<h3>🖼 Upload Imagem</h3>

<input type="file" id="imagemInput">

</div>

<div class="box">

<h3>💰 Monetização</h3>

<input
type="number"
id="preco"
placeholder="Preço">

<select id="tipo">

<option>Grátis</option>
<option>Pago</option>
<option>Premium</option>

</select>

</div>

<button id="publicar">
Publicar Prompt
</button>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
doc,
updateDoc,
getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {

apiKey: "AIzaSyDtej7UQeiU-c9if4EKQH62j-PlS1gHTxA",
authDomain: "gamboprompts-8ff6d.firebaseapp.com",
projectId: "gamboprompts-8ff6d",
storageBucket: "gamboprompts-8ff6d.firebasestorage.app",
messagingSenderId: "92750073125",
appId: "1:92750073125:web:d29723c203a0468ecf1ecc"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const auth = getAuth(app);

onAuthStateChanged(auth, (user) => {

if(!user){

window.location.href = "login.html";

}

});

let editandoId = null;

let categorias = [
"Design",
"Marketing",
"Programação",
"Imagens IA",
"Vídeos IA",
"Negócios"
];

function carregarCategorias(){

const select =
document.getElementById("categoria");

select.innerHTML = "";

categorias.forEach((cat) => {

select.innerHTML += `
<option value="${cat}">
${cat}
</option>
`;

});

listarCategorias();

}

function listarCategorias(){

const lista =
document.getElementById("listaCategorias");

lista.innerHTML = "";

categorias.forEach((cat,index) => {

lista.innerHTML += `

<div class="categoria-item">

<span>${cat}</span>

<div class="categoria-buttons">

<button
class="editar-cat"
onclick="editarCategoria(${index})">
✏️
</button>

<button
class="apagar-cat"
onclick="apagarCategoria(${index})">
🗑️
</button>

</div>

</div>

`;

});

}

window.editarCategoria = function(index){

const novo =
prompt(
"Editar categoria:",
categorias[index]
);

if(!novo) return;

categorias[index] = novo;

carregarCategorias();

}

window.apagarCategoria = function(index){

const confirmar =
confirm("Apagar categoria?");

if(!confirmar) return;

categorias.splice(index,1);

carregarCategorias();

}

document
.getElementById("adicionarCategoria")
.addEventListener("click", () => {

const nova =
document
.getElementById("novaCategoria")
.value
.trim();

if(nova === "") return;

if(categorias.includes(nova)){

alert("Categoria já existe");

return;

}

categorias.push(nova);

document.getElementById("novaCategoria").value = "";

carregarCategorias();

});

async function carregarDashboard(){

const snapshot =
await getDocs(collection(db,"prompts"));

let total = 0;

let premium = 0;

const cats = [];

snapshot.forEach((docItem) => {

const data = docItem.data();

total++;

if(data.tipo === "Premium"){
premium++;
}

if(!cats.includes(data.categoria)){
cats.push(data.categoria);
}

});

document.getElementById("totalPrompts")
.innerText = total;

document.getElementById("totalPremium")
.innerText = premium;

document.getElementById("totalCategorias")
.innerText = cats.length;

}

/* LISTAR COMPRAS */

async function listarCompras(){

const snapshot =
await getDocs(collection(db,"compras"));

const lista =
document.getElementById("listaCompras");

lista.innerHTML = "";

snapshot.forEach((docItem) => {

const data = docItem.data();

lista.innerHTML += `

<div class="card">

<h2>
🛒 ${data.promptTitulo || "Prompt"}
</h2>

<p style="margin-top:10px;">
👤 ${data.nome || ""}
</p>

<p style="margin-top:10px;">
📱 ${data.whatsapp || ""}
</p>

<p style="margin-top:10px;">
💳 ${data.metodo || ""}
</p>

<p style="margin-top:10px;">
💰 ${data.valor || 0} Kz
</p>

<p class="status ${data.status === "aprovado" ? "aprovado" : "pendente"}">

⏳ ${data.status || "pendente"}

</p>

${
data.comprovativo
?

`
<img
src="${data.comprovativo}"
class="comp-img">
`

:

""

}

<div class="card-buttons">

<button
class="editar-btn"
onclick="aprovarCompra('${docItem.id}')">

✅ Aprovar

</button>

<button
class="apagar-btn"
onclick="apagarCompra('${docItem.id}')">

🗑️ Apagar

</button>

</div>

</div>

`;

});

}

window.aprovarCompra = async function(id){

await updateDoc(
doc(db,"compras",id),
{
status:"aprovado"
}
);

alert("✅ Compra aprovada");

listarCompras();

}

window.apagarCompra = async function(id){

const confirmar =
confirm("Apagar compra?");

if(!confirmar) return;

await deleteDoc(
doc(db,"compras",id)
);

listarCompras();

}

async function listarPrompts(){

const snapshot =
await getDocs(collection(db,"prompts"));

const lista =
document.getElementById("listaPrompts");

lista.innerHTML = "";

snapshot.forEach((docItem) => {

const data = docItem.data();

lista.innerHTML += `

<div class="card">

<img src="${data.imagem}">

<h2>${data.titulo}</h2>

<p style="margin-top:10px;">
📂 ${data.categoria}
</p>

<p style="margin-top:10px;">
❤️ ${data.likes || 0} Likes
</p>

<div class="card-buttons">

<button
class="editar-btn"
onclick="editarPrompt('${docItem.id}')">
✏️ Editar
</button>

<button
class="apagar-btn"
onclick="apagarPrompt('${docItem.id}')">
🗑️ Apagar
</button>

</div>

</div>

`;

});

}

window.editarPrompt = async function(id){

const ref = doc(db,"prompts",id);

const snap = await getDoc(ref);

const data = snap.data();

editandoId = id;

document.getElementById("titulo").value = data.titulo || "";
document.getElementById("prompt").value = data.prompt || "";
document.getElementById("instrucoes").value = data.instrucoes || "";
document.getElementById("categoria").value = data.categoria || "";
document.getElementById("afiliado").value = data.afiliado || "";
document.getElementById("doacao").value = data.doacao || "";
document.getElementById("preco").value = data.preco || "";
document.getElementById("tipo").value = data.tipo || "Grátis";

document.getElementById("publicar")
.innerText = "Atualizar Prompt";

window.scrollTo({
top:0,
behavior:"smooth"
});

}

window.apagarPrompt = async function(id){

const confirmar =
confirm("Deseja apagar?");

if(!confirmar) return;

await deleteDoc(doc(db,"prompts",id));

listarPrompts();

carregarDashboard();

}

document
.getElementById("publicar")
.addEventListener("click", async () => {

try{

const titulo =
document.getElementById("titulo").value;

const promptText =
document.getElementById("prompt").value;

const instrucoes =
document.getElementById("instrucoes").value;

const categoria =
document.getElementById("categoria").value;

const afiliado =
document.getElementById("afiliado").value;

const doacao =
document.getElementById("doacao").value;

const preco =
document.getElementById("preco").value;

const tipo =
document.getElementById("tipo").value;

const imagemInput =
document.getElementById("imagemInput");

const imagemFile =
imagemInput.files[0];

let imagemUrl = null;

if(imagemFile){

const formData = new FormData();

formData.append("file", imagemFile);

formData.append(
"upload_preset",
"gamboprompts"
);

const resposta = await fetch(
"https://api.cloudinary.com/v1_1/derwtydzg/image/upload",
{
method:"POST",
body:formData
}
);

const dados =
await resposta.json();

imagemUrl =
dados.secure_url;

}

if(editandoId){

const ref =
doc(db,"prompts",editandoId);

const snap =
await getDoc(ref);

const atual =
snap.data();

await updateDoc(ref,{

titulo,
prompt: promptText,
descricao: promptText,
instrucoes,
categoria,
afiliado,
doacao,
preco,
tipo,
likes: atual.likes || 0,
imagem: imagemUrl || atual.imagem

});

editandoId = null;

document.getElementById("publicar")
.innerText = "Publicar Prompt";

alert("✅ Atualizado");

}else{

await addDoc(
collection(db,"prompts"),
{

titulo,
prompt: promptText,
descricao: promptText,
instrucoes,
categoria,
afiliado,
doacao,
preco,
tipo,
likes:0,
imagem: imagemUrl || "https://images.unsplash.com/photo-1518770660439-4636190af475?w=1200&q=80"

}
);

alert("✅ Publicado");

}

document.getElementById("titulo").value = "";
document.getElementById("prompt").value = "";
document.getElementById("instrucoes").value = "";
document.getElementById("afiliado").value = "";
document.getElementById("doacao").value = "";
document.getElementById("preco").value = "";
document.getElementById("imagemInput").value = "";

listarPrompts();

carregarDashboard();

}catch(error){

console.log(error);

alert("Erro");

}

});

document
.getElementById("logout")
.addEventListener("click", async () => {

await signOut(auth);

window.location.href = "login.html";

});

carregarCategorias();

listarPrompts();

carregarDashboard();

listarCompras();

</script>

</body>

</html>
