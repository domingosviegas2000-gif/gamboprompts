<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Painel Admin</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

header{
  background:#111827;
  padding:15px;
  display:flex;
  justify-content:space-between;
}

.container{padding:20px;}

.section{
  background:#111827;
  padding:15px;
  margin-top:20px;
  border-radius:10px;
}

button{
  padding:8px 12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.danger{background:#ef4444;color:white;}
.primary{background:#3b82f6;color:white;}

.item{
  background:#1f2937;
  padding:10px;
  margin-top:10px;
  display:flex;
  justify-content:space-between;
  border-radius:8px;
}

#loading{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
</style>
</head>

<body>

<div id="loading">A verificar sessão...</div>

<div id="app" style="display:none;">

<header>
  <h3>🔥 Admin Panel</h3>
  <button id="logoutBtn" class="danger">Sair</button>
</header>

<div class="container">

<div class="section">
  <h3>📊 Dashboard</h3>
  <p>Prompts: <span id="totalPrompts">0</span></p>
  <p>Categorias: <span id="totalCategories">0</span></p>
</div>

<div class="section">
  <h3>📂 Categorias</h3>
  <button class="primary" onclick="addCategory()">Criar Categoria</button>
  <div id="categories"></div>
</div>

<div class="section">
  <h3>📚 Prompts</h3>
  <button class="primary" onclick="addPrompt()">Criar Prompt</button>
  <div id="prompts"></div>
</div>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  deleteDoc,
  doc,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut,
  setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

// ================= FIREBASE CONFIG =================
const firebaseConfig = {
  apiKey: "SUA_API",
  authDomain: "SEU_AUTH",
  projectId: "SEU_PROJECT",
  storageBucket: "SEU_BUCKET",
  messagingSenderId: "SEU_ID",
  appId: "SEU_APP"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

// ================= AUTH FIX DEFINITIVO =================
await setPersistence(auth, browserLocalPersistence);

const loading = document.getElementById("loading");
const appDiv = document.getElementById("app");

onAuthStateChanged(auth, (user) => {

  if (user) {
    loading.style.display = "none";
    appDiv.style.display = "block";
  } else {
    window.location.href = "login.html";
  }

});

// logout
document.getElementById("logoutBtn").addEventListener("click", async () => {
  await signOut(auth);
  window.location.href = "login.html";
});

// ================= FIRESTORE =================
const catRef = collection(db,"categories");
const promptRef = collection(db,"prompts");

// categorias
onSnapshot(catRef,(snap)=>{
  document.getElementById("totalCategories").innerText = snap.size;

  let html="";
  snap.forEach(d=>{
    html += `
      <div class="item">
        <span>${d.data().name}</span>
        <button class="danger" onclick="deleteCategory('${d.id}')">Apagar</button>
      </div>
    `;
  });

  document.getElementById("categories").innerHTML = html;
});

// prompts
onSnapshot(promptRef,(snap)=>{
  document.getElementById("totalPrompts").innerText = snap.size;

  let html="";
  snap.forEach(d=>{
    html += `
      <div class="item">
        <span>${d.data().title} (${d.data().type})</span>
        <button class="danger" onclick="deletePrompt('${d.id}')">Apagar</button>
      </div>
    `;
  });

  document.getElementById("prompts").innerHTML = html;
});

// ================= CRUD =================
window.addCategory = async ()=>{
  let name = prompt("Nome da categoria:");
  if(!name) return;

  await addDoc(collection(db,"categories"),{
    name,
    createdAt:Date.now()
  });
};

window.deleteCategory = async (id)=>{
  await deleteDoc(doc(db,"categories",id));
};

window.addPrompt = async ()=>{
  let title = prompt("Título:");
  let type = prompt("Tipo (free/paid/premium):","free");

  await addDoc(collection(db,"prompts"),{
    title,
    type,
    createdAt:Date.now()
  });
};

window.deletePrompt = async (id)=>{
  await deleteDoc(doc(db,"prompts",id));
};

</script>

</body>
</html>
