<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
doc,
updateDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyBX3X9rq_-JALXfUhZscA97ef50DJLXa2w",

authDomain: "gamboprompts.firebaseapp.com",

projectId: "gamboprompts",

storageBucket: "gamboprompts.firebasestorage.app",

messagingSenderId: "582015637499",

appId: "1:582015637499:web:5342fb4c0e01b6b8c9dd5e",

measurementId: "G-0WE20EK5TY"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const imageFile =
document.getElementById("imageFile");

const previewImage =
document.getElementById("previewImage");

const promptList =
document.getElementById("promptList");

imageFile.addEventListener("change",()=>{

const file = imageFile.files[0];

if(file){

previewImage.src =
URL.createObjectURL(file);

previewImage.style.display = "block";

}

});

window.savePrompt = async function(){

const title =
document.getElementById("title").value.trim();

const prompt =
document.getElementById("prompt").value.trim();

const instructions =
document.getElementById("instructions").value.trim();

const category =
document.getElementById("category").value;

const premium =
document.getElementById("premium").value;

const tags =
document.getElementById("tags")
.value.trim();

const editId =
document.getElementById("editIndex")
.value;

let image = "";

if(previewImage.src){

image = previewImage.src;

}

const data = {

title,
prompt,
instructions,
image,
category,
premium,
tags,
createdAt: Date.now()

};

if(!title || !prompt){

alert("Preencha título e prompt");

return;

}

try{

if(editId){

await updateDoc(
doc(db,"gambo_prompts",editId),
data
);

alert("Prompt atualizado");

}else{

await addDoc(
collection(db,"gambo_prompts"),
data
);

alert("Prompt salvo online");

}

clearForm();

loadPrompts();

}catch(error){

console.error(error);

alert("Erro ao salvar");

}

};

window.loadPrompts = async function(){

promptList.innerHTML = `
<p>A carregar prompts...</p>
`;

try{

const querySnapshot =
await getDocs(
collection(db,"gambo_prompts")
);

promptList.innerHTML = "";

let total = 0;
let premiumCount = 0;

querySnapshot.forEach((docItem)=>{

const p = docItem.data();

const id = docItem.id;

total++;

if(p.premium === "true"){

premiumCount++;

}

promptList.innerHTML += `

<div class="prompt-card">

<h2>${p.title || ""}</h2>

<p>${p.prompt || ""}</p>

<h4>Como usar:</h4>

<p>${p.instructions || ""}</p>

${
p.image
? `<img src="${p.image}">`
: ""
}

<p>
<b>Categoria:</b>
${p.category || ""}
</p>

<p>
<b>Tags:</b>
${p.tags || ""}
</p>

${
p.premium === "true"
? "<p class='premium'>PREMIUM</p>"
: "<p>GRÁTIS</p>"
}

<button
class="edit"
onclick="editPrompt(
'${id}',
\`${p.title || ""}\`,
\`${p.prompt || ""}\`,
\`${p.instructions || ""}\`,
\`${p.category || ""}\`,
\`${p.premium || "false"}\`,
\`${p.tags || ""}\`,
\`${p.image || ""}\`
)">
Editar
</button>

<button
class="delete"
onclick="deletePrompt('${id}')">
Apagar
</button>

</div>

`;

});

document.getElementById("totalPrompts")
.innerText = total;

document.getElementById("premiumCount")
.innerText = premiumCount;

}catch(error){

console.error(error);

promptList.innerHTML = `
<p>Erro ao carregar prompts</p>
`;

}

};

window.editPrompt = function(
id,
title,
prompt,
instructions,
category,
premium,
tags,
image
){

document.getElementById("editIndex")
.value = id;

document.getElementById("title")
.value = title;

document.getElementById("prompt")
.value = prompt;

document.getElementById("instructions")
.value = instructions;

document.getElementById("category")
.value = category;

document.getElementById("premium")
.value = premium;

document.getElementById("tags")
.value = tags;

if(image){

previewImage.src = image;

previewImage.style.display = "block";

}

window.scrollTo({

top:0,
behavior:"smooth"

});

};

window.deletePrompt = async function(id){

const confirmDelete =
confirm("Apagar prompt?");

if(!confirmDelete) return;

try{

await deleteDoc(
doc(db,"gambo_prompts",id)
);

loadPrompts();

}catch(error){

console.error(error);

alert("Erro ao apagar");

}

};

window.clearForm = function(){

document.getElementById("editIndex")
.value = "";

document.getElementById("title")
.value = "";

document.getElementById("prompt")
.value = "";

document.getElementById("instructions")
.value = "";

document.getElementById("tags")
.value = "";

previewImage.style.display = "none";

};

window.addCategory = function(){

const category =
document.getElementById("newCategory")
.value.trim();

if(!category){

alert("Digite categoria");

return;

}

const select =
document.getElementById("category");

const option =
document.createElement("option");

option.text = category;

select.add(option);

document.getElementById("newCategory")
.value = "";

alert("Categoria adicionada");

};

window.exportPrompts = async function(){

const querySnapshot =
await getDocs(
collection(db,"gambo_prompts")
);

const prompts = [];

querySnapshot.forEach((docItem)=>{

prompts.push({

id: docItem.id,
...docItem.data()

});

});

const dataStr =
JSON.stringify(prompts,null,2);

const blob =
new Blob(
[dataStr],
{type:"application/json"}
);

const url =
URL.createObjectURL(blob);

const a =
document.createElement("a");

a.href = url;

a.download = "gamboprompts.json";

a.click();

};

window.importPrompts = function(){

const file =
document.getElementById("importFile")
.files[0];

if(!file){

alert("Escolha um ficheiro");

return;

}

const reader =
new FileReader();

reader.onload = async function(e){

const imported =
JSON.parse(e.target.result);

for(const item of imported){

await addDoc(
collection(db,"gambo_prompts"),
item
);

}

alert("Prompts importados");

loadPrompts();

};

reader.readAsText(file);

};

window.saveMonetization = function(){

const monetization = {

gumroad:
document.getElementById("gumroad")
.value,

kofi:
document.getElementById("kofi")
.value,

affiliate:
document.getElementById("affiliate")
.value,

adsense:
document.getElementById("adsense")
.value

};

localStorage.setItem(
"monetization",
JSON.stringify(monetization)
);

alert("Monetização salva");

};

loadPrompts();

</script>
