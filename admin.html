<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel Administrativo</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
padding:25px;
}

h1{
margin-bottom:25px;
}

input,
textarea,
select{
width:100%;
padding:15px;
margin-bottom:20px;
border:none;
border-radius:10px;
background:#1e293b;
color:white;
font-size:16px;
}

textarea{
resize:none;
}

.box{
background:#111827;
padding:20px;
border-radius:15px;
margin-bottom:20px;
}

h3{
margin-bottom:15px;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:10px;
background:#38bdf8;
color:black;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:0.9;
}

#dashboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:30px;
}

.logout-btn{
width:auto;
padding:12px 20px;
margin-bottom:30px;
background:#ef4444;
color:white;
}

.card{
background:#1e293b;
padding:20px;
border-radius:12px;
margin-bottom:20px;
}

.card img{
width:100%;
height:220px;
object-fit:cover;
border-radius:10px;
margin-bottom:15px;
}

.card-buttons{
display:flex;
gap:10px;
margin-top:15px;
}

.editar-btn{
background:#f59e0b;
color:white;
}

.apagar-btn{
background:#ef4444;
color:white;
}

.like-btn{
background:#22c55e;
color:white;
}

</style>

</head>

<body>

<h1>🔥 Painel Administrativo</h1>

<button id="logout" class="logout-btn">
🚪 Terminar Sessão
</button>

<!-- DASHBOARD -->

<div id="dashboard">

<div class="box">

<h3>Total de Prompts</h3>

<h1 id="totalPrompts">0</h1>

</div>

<div class="box">

<h3>Prompts Premium</h3>

<h1 id="totalPremium">0</h1>

</div>

<div class="box">

<h3>Categorias</h3>

<h1 id="totalCategorias">0</h1>

</div>

</div>

<!-- PROMPTS -->

<div class="box">

<h2 style="margin-bottom:20px;">
📚 Prompts Publicados
</h2>

<div id="listaPrompts"></div>

</div>

<!-- FORM -->

<input
type="text"
id="titulo"
placeholder="Título do Prompt">

<textarea
id="prompt"
placeholder="Escreva o prompt completo aqui..."
style="height:250px;"></textarea>

<textarea
id="instrucoes"
placeholder="Como usar este prompt..."
style="height:180px;"></textarea>

<!-- CATEGORIA -->

<select id="categoria"></select>

<!-- NOVA CATEGORIA -->

<div class="box">

<h3>Adicionar Categoria</h3>

<input
type="text"
id="novaCategoria"
placeholder="Nova categoria">

<button id="adicionarCategoria">
➕ Adicionar Categoria
</button>

</div>

<!-- AFILIADO -->

<input
type="text"
id="afiliado"
placeholder="Link de afiliado">

<!-- DOAÇÃO -->

<input
type="text"
id="doacao"
placeholder="Link para doações">

<!-- IMAGEM -->

<div class="box">

<h3>Upload de Imagem</h3>

<input type="file" id="imagemInput">

</div>

<!-- MONETIZAÇÃO -->

<div class="box">

<h3>Monetização</h3>

<input
type="number"
id="preco"
placeholder="Preço do Prompt">

<select id="tipo">

<option>Grátis</option>
<option>Pago</option>
<option>Premium</option>

</select>

</div>

<button id="publicar">
Publicar Prompt
</button>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
doc,
updateDoc,
getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* =========================
FIREBASE
========================= */

const firebaseConfig = {

apiKey: "AIzaSyDtej7UQeiU-c9if4EKQH62j-PlS1gHTxA",

authDomain: "gamboprompts-8ff6d.firebaseapp.com",

projectId: "gamboprompts-8ff6d",

storageBucket: "gamboprompts-8ff6d.firebasestorage.app",

messagingSenderId: "92750073125",

appId: "1:92750073125:web:d29723c203a0468ecf1ecc"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const auth = getAuth(app);

/* =========================
PROTEGER ADMIN
========================= */

onAuthStateChanged(auth, (user) => {

if(!user){

window.location.href = "login.html";

}

});

/* =========================
VARIÁVEIS
========================= */

let editandoId = null;

let categorias = [
"Design",
"Marketing",
"Programação",
"Imagens IA",
"Vídeos IA",
"Negócios"
];

/* =========================
CARREGAR CATEGORIAS
========================= */

function carregarCategorias(){

const select =
document.getElementById("categoria");

select.innerHTML = "";

categorias.forEach((cat) => {

select.innerHTML += `
<option>${cat}</option>
`;

});

}

carregarCategorias();

/* =========================
ADICIONAR CATEGORIA
========================= */

document
.getElementById("adicionarCategoria")
.addEventListener("click", () => {

const nova =
document.getElementById("novaCategoria").value;

if(nova === "") return;

if(!categorias.includes(nova)){

categorias.push(nova);

carregarCategorias();

alert("✅ Categoria adicionada");

document.getElementById("novaCategoria").value = "";

}

});

/* =========================
DASHBOARD
========================= */

async function carregarDashboard(){

const snapshot =
await getDocs(collection(db, "prompts"));

let total = 0;

let premium = 0;

const cats = [];

snapshot.forEach((docItem) => {

const data = docItem.data();

total++;

if(data.tipo === "Premium"){

premium++;

}

if(!cats.includes(data.categoria)){

cats.push(data.categoria);

}

});

document.getElementById("totalPrompts")
.innerText = total;

document.getElementById("totalPremium")
.innerText = premium;

document.getElementById("totalCategorias")
.innerText = cats.length;

}

carregarDashboard();

/* =========================
LISTAR PROMPTS
========================= */

async function listarPrompts(){

const snapshot =
await getDocs(collection(db, "prompts"));

const lista =
document.getElementById("listaPrompts");

lista.innerHTML = "";

snapshot.forEach((docItem) => {

const data = docItem.data();

lista.innerHTML += `

<div class="card">

<img src="${data.imagem}">

<h2>${data.titulo}</h2>

<p style="margin-top:10px;">
${data.categoria}
</p>

<p style="
margin-top:10px;
opacity:0.8;
">
❤️ ${data.likes || 0} Likes
</p>

<div class="card-buttons">

<button
class="editar-btn"
onclick="editarPrompt('${docItem.id}')">
✏️ Editar
</button>

<button
class="apagar-btn"
onclick="apagarPrompt('${docItem.id}')">
🗑️ Apagar
</button>

<button
class="like-btn"
onclick="likePrompt('${docItem.id}', ${data.likes || 0})">
❤️ Like
</button>

</div>

</div>

`;

});

}

listarPrompts();

/* =========================
PUBLICAR / EDITAR
========================= */

document
.getElementById("publicar")
.addEventListener("click", async () => {

try{

const titulo =
document.getElementById("titulo").value;

const prompt =
document.getElementById("prompt").value;

const instrucoes =
document.getElementById("instrucoes").value;

const categoria =
document.getElementById("categoria").value;

const afiliado =
document.getElementById("afiliado").value;

const doacao =
document.getElementById("doacao").value;

const preco =
document.getElementById("preco").value;

const tipo =
document.getElementById("tipo").value;

const imagemInput =
document.getElementById("imagemInput");

const imagemFile =
imagemInput.files[0];

let imagemUrl =
"https://images.unsplash.com/photo-1518770660439-4636190af475?w=1200&q=80";

if(imagemFile){

const formData = new FormData();

formData.append("file", imagemFile);

formData.append(
"upload_preset",
"gamboprompts"
);

const resposta = await fetch(
"https://api.cloudinary.com/v1_1/derwtydzg/image/upload",
{
method:"POST",
body:formData
}
);

const dados =
await resposta.json();

imagemUrl =
dados.secure_url;

}

if(editandoId){

const promptRef =
doc(db, "prompts", editandoId);

const novosDados = {

titulo,
prompt,
instrucoes,
categoria,
afiliado,
doacao,
preco,
tipo,
descricao: prompt

};

if(imagemFile){

novosDados.imagem = imagemUrl;

}

await updateDoc(promptRef, novosDados);

alert("✅ Prompt atualizado!");

editandoId = null;

document.getElementById("publicar")
.innerText = "Publicar Prompt";

}else{

await addDoc(
collection(db, "prompts"),
{

titulo,
prompt,
descricao: prompt,
instrucoes,
categoria,
afiliado,
doacao,
preco,
tipo,
imagem: imagemUrl,
likes:0

}
);

alert("✅ Prompt publicado!");

}

document.getElementById("titulo").value = "";
document.getElementById("prompt").value = "";
document.getElementById("instrucoes").value = "";
document.getElementById("afiliado").value = "";
document.getElementById("doacao").value = "";
document.getElementById("preco").value = "";
document.getElementById("imagemInput").value = "";

listarPrompts();

carregarDashboard();

}catch(error){

console.log(error);

alert("❌ Erro");

}

});

/* =========================
EDITAR
========================= */

window.editarPrompt =
async function(id){

const ref =
doc(db, "prompts", id);

const snap =
await getDoc(ref);

const data =
snap.data();

editandoId = id;

document.getElementById("titulo").value =
data.titulo || "";

document.getElementById("prompt").value =
data.prompt || "";

document.getElementById("instrucoes").value =
data.instrucoes || "";

document.getElementById("categoria").value =
data.categoria || "";

document.getElementById("afiliado").value =
data.afiliado || "";

document.getElementById("doacao").value =
data.doacao || "";

document.getElementById("preco").value =
data.preco || "";

document.getElementById("tipo").value =
data.tipo || "Grátis";

document.getElementById("publicar")
.innerText = "Atualizar Prompt";

window.scrollTo({
top:0,
behavior:"smooth"
});

}

/* =========================
APAGAR
========================= */

window.apagarPrompt =
async function(id){

const confirmar =
confirm("Deseja apagar este prompt?");

if(!confirmar) return;

await deleteDoc(doc(db, "prompts", id));

alert("✅ Prompt apagado!");

listarPrompts();

carregarDashboard();

}

/* =========================
LIKE
========================= */

window.likePrompt =
async function(id, likesAtual){

const ref =
doc(db, "prompts", id);

await updateDoc(ref, {

likes: likesAtual + 1

});

listarPrompts();

}

/* =========================
LOGOUT
========================= */

document
.getElementById("logout")
.addEventListener("click", async () => {

await signOut(auth);

window.location.href = "login.html";

});

</script>

</body>

</html>
