<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel Administrativo</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
padding:25px;
}

h1{
margin-bottom:25px;
}

input,
textarea,
select{
width:100%;
padding:15px;
margin-bottom:20px;
border:none;
border-radius:10px;
background:#1e293b;
color:white;
font-size:16px;
}

textarea{
resize:none;
}

.box{
background:#111827;
padding:20px;
border-radius:15px;
margin-bottom:20px;
}

h3{
margin-bottom:15px;
}

button{
padding:14px;
border:none;
border-radius:10px;
font-size:15px;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:0.9;
}

#publicar{
width:100%;
background:#38bdf8;
color:black;
}

.logout-btn{
background:#ef4444;
color:white;
margin-bottom:25px;
}

#dashboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:12px;
margin-bottom:20px;
}

.card img{
width:100%;
height:220px;
object-fit:cover;
border-radius:10px;
margin-bottom:15px;
}

.card-buttons{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:15px;
}

.editar-btn{
background:#f59e0b;
color:white;
flex:1;
}

.apagar-btn{
background:#ef4444;
color:white;
flex:1;
}

.like-btn{
background:#22c55e;
color:white;
flex:1;
}

.categoria-item{
background:#1e293b;
padding:15px;
border-radius:10px;
margin-bottom:10px;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.categoria-buttons{
display:flex;
gap:10px;
}

.editar-cat{
background:#f59e0b;
color:white;
}

.apagar-cat{
background:#ef4444;
color:white;
}

.add-cat{
width:100%;
background:#22c55e;
color:white;
margin-bottom:20px;
}

</style>

</head>

<body>

<h1>🔥 Painel Administrativo</h1>

<button id="logout" class="logout-btn">
🚪 Terminar Sessão
</button>

<!-- DASHBOARD -->

<div id="dashboard">

<div class="box">
<h3>Total de Prompts</h3>
<h1 id="totalPrompts">0</h1>
</div>

<div class="box">
<h3>Prompts Premium</h3>
<h1 id="totalPremium">0</h1>
</div>

<div class="box">
<h3>Categorias</h3>
<h1 id="totalCategorias">0</h1>
</div>

</div>

<!-- CATEGORIAS -->

<div class="box">

<h3>📂 Gerenciar Categorias</h3>

<input
type="text"
id="novaCategoria"
placeholder="Nova categoria">

<button
id="adicionarCategoria"
class="add-cat">
➕ Adicionar Categoria
</button>

<div id="listaCategorias"></div>

</div>

<!-- LISTA PROMPTS -->

<div class="box">

<h3>📚 Prompts Publicados</h3>

<div id="listaPrompts"></div>

</div>

<!-- FORM -->

<input
type="text"
id="titulo"
placeholder="Título do Prompt">

<textarea
id="prompt"
placeholder="Escreva o prompt..."
style="height:250px;"></textarea>

<textarea
id="instrucoes"
placeholder="Como usar..."
style="height:180px;"></textarea>

<select id="categoria"></select>

<input
type="text"
id="afiliado"
placeholder="Link afiliado">

<input
type="text"
id="doacao"
placeholder="Link doação">

<div class="box">

<h3>🖼 Upload Imagem</h3>

<input type="file" id="imagemInput">

</div>

<div class="box">

<h3>💰 Monetização</h3>

<input
type="number"
id="preco"
placeholder="Preço">

<select id="tipo">

<option>Grátis</option>
<option>Pago</option>
<option>Premium</option>

</select>

</div>

<button id="publicar">
Publicar Prompt
</button>

<script type="module">

/* FIREBASE */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
doc,
updateDoc,
getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* CONFIG */

const firebaseConfig = {

apiKey: "AIzaSyDtej7UQeiU-c9if4EKQH62j-PlS1gHTxA",

authDomain: "gamboprompts-8ff6d.firebaseapp.com",

projectId: "gamboprompts-8ff6d",

storageBucket: "gamboprompts-8ff6d.firebasestorage.app",

messagingSenderId: "92750073125",

appId: "1:92750073125:web:d29723c203a0468ecf1ecc"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const auth = getAuth(app);

/* LOGIN */

onAuthStateChanged(auth, (user) => {

if(user){

console.log("ADMIN LOGADO");

}else{

setTimeout(() => {

if(!auth.currentUser){

window.location.href = "login.html";

}

},1000);

}

});

/* VARIÁVEIS */

let editandoId = null;

let categorias = [
"Design",
"Marketing",
"Programação",
"Imagens IA",
"Vídeos IA",
"Negócios"
];

/* CATEGORIAS */

function carregarCategorias(){

const select =
document.getElementById("categoria");

select.innerHTML = "";

categorias.forEach((cat) => {

select.innerHTML += `
<option value="${cat}">
${cat}
</option>
`;

});

listarCategorias();

}

function listarCategorias(){

const lista =
document.getElementById("listaCategorias");

lista.innerHTML = "";

categorias.forEach((cat,index) => {

const div =
document.createElement("div");

div.className = "categoria-item";

div.innerHTML = `

<span>${cat}</span>

<div class="categoria-buttons">

<button class="editar-cat">
✏️
</button>

<button class="apagar-cat">
🗑️
</button>

</div>

`;

div.querySelector(".editar-cat")
.addEventListener("click", () => {

editarCategoria(index);

});

div.querySelector(".apagar-cat")
.addEventListener("click", () => {

apagarCategoria(index);

});

lista.appendChild(div);

});

}

document
.getElementById("adicionarCategoria")
.addEventListener("click", () => {

const nova =
document
.getElementById("novaCategoria")
.value
.trim();

if(nova === ""){

alert("Digite categoria");

return;

}

if(categorias.includes(nova)){

alert("Categoria já existe");

return;

}

categorias.push(nova);

document.getElementById("novaCategoria").value = "";

carregarCategorias();

});

function editarCategoria(index){

const atual = categorias[index];

const novo =
prompt("Editar categoria:", atual);

if(!novo) return;

categorias[index] = novo;

carregarCategorias();

}

function apagarCategoria(index){

const confirmar =
confirm("Apagar categoria?");

if(!confirmar) return;

categorias.splice(index,1);

carregarCategorias();

}

/* DASHBOARD */

async function carregarDashboard(){

const snapshot =
await getDocs(collection(db,"prompts"));

let total = 0;

let premium = 0;

const cats = [];

snapshot.forEach((docItem) => {

const data = docItem.data();

total++;

if(data.tipo === "Premium"){
premium++;
}

if(!cats.includes(data.categoria)){
cats.push(data.categoria);
}

});

document.getElementById("totalPrompts")
.innerText = total;

document.getElementById("totalPremium")
.innerText = premium;

document.getElementById("totalCategorias")
.innerText = cats.length;

}

/* LISTAR PROMPTS */

async function listarPrompts(){

const snapshot =
await getDocs(collection(db,"prompts"));

const lista =
document.getElementById("listaPrompts");

lista.innerHTML = "";

snapshot.forEach((docItem) => {

const data = docItem.data();

const card =
document.createElement("div");

card.className = "card";

card.innerHTML = `

<img src="${data.imagem}">

<h2>${data.titulo}</h2>

<p style="margin-top:10px;">
📂 ${data.categoria}
</p>

<p style="margin-top:10px;">
❤️ ${data.likes || 0} Likes
</p>

<div class="card-buttons">

<button class="editar-btn">
✏️ Editar
</button>

<button class="apagar-btn">
🗑️ Apagar
</button>

<button class="like-btn">
❤️ Like
</button>

</div>

`;

card.querySelector(".editar-btn")
.addEventListener("click", () => {

editarPrompt(docItem.id);

});

card.querySelector(".apagar-btn")
.addEventListener("click", () => {

apagarPrompt(docItem.id);

});

card.querySelector(".like-btn")
.addEventListener("click", () => {

likePrompt(
docItem.id,
data.likes || 0
);

});

lista.appendChild(card);

});

}

/* PUBLICAR */

document
.getElementById("publicar")
.addEventListener("click", salvarPrompt);

async function salvarPrompt(){

try{

const titulo =
document.getElementById("titulo").value;

const promptText =
document.getElementById("prompt").value;

const instrucoes =
document.getElementById("instrucoes").value;

const categoria =
document.getElementById("categoria").value;

const afiliado =
document.getElementById("afiliado").value;

const doacao =
document.getElementById("doacao").value;

const preco =
document.getElementById("preco").value;

const tipo =
document.getElementById("tipo").value;

const imagemInput =
document.getElementById("imagemInput");

const imagemFile =
imagemInput.files[0];

let imagemUrl = null;

/* CLOUDINARY */

if(imagemFile){

const formData = new FormData();

formData.append("file", imagemFile);

formData.append(
"upload_preset",
"gamboprompts"
);

const resposta = await fetch(
"https://api.cloudinary.com/v1_1/derwtydzg/image/upload",
{
method:"POST",
body:formData
}
);

const dados =
await resposta.json();

imagemUrl =
dados.secure_url;

}

/* EDITAR */

if(editandoId){

const ref =
doc(db,"prompts",editandoId);

const snap =
await getDoc(ref);

const atual =
snap.data();

await updateDoc(ref,{

titulo,
prompt: promptText,
descricao: promptText,
instrucoes,
categoria,
afiliado,
doacao,
preco,
tipo,
likes: atual.likes || 0,
imagem: imagemUrl || atual.imagem

});

alert("✅ Atualizado");

editandoId = null;

document.getElementById("publicar")
.innerText = "Publicar Prompt";

}else{

/* NOVO */

await addDoc(
collection(db,"prompts"),
{

titulo,
prompt: promptText,
descricao: promptText,
instrucoes,
categoria,
afiliado,
doacao,
preco,
tipo,
likes:0,
imagem: imagemUrl || "https://images.unsplash.com/photo-1518770660439-4636190af475?w=1200&q=80"

}
);

alert("✅ Publicado");

}

/* LIMPAR */

document.getElementById("titulo").value = "";
document.getElementById("prompt").value = "";
document.getElementById("instrucoes").value = "";
document.getElementById("afiliado").value = "";
document.getElementById("doacao").value = "";
document.getElementById("preco").value = "";
document.getElementById("imagemInput").value = "";

listarPrompts();

carregarDashboard();

}catch(error){

console.log(error);

alert("Erro");

}

}

/* EDITAR PROMPT */

async function editarPrompt(id){

try{

const ref =
doc(db,"prompts",id);

const snap =
await getDoc(ref);

if(!snap.exists()){

alert("Prompt não encontrado");

return;

}

const data =
snap.data();

editandoId = id;

document.getElementById("titulo").value =
data.titulo || "";

document.getElementById("prompt").value =
data.prompt || "";

document.getElementById("instrucoes").value =
data.instrucoes || "";

document.getElementById("categoria").value =
data.categoria || "";

document.getElementById("afiliado").value =
data.afiliado || "";

document.getElementById("doacao").value =
data.doacao || "";

document.getElementById("preco").value =
data.preco || "";

document.getElementById("tipo").value =
data.tipo || "Grátis";

document.getElementById("publicar")
.innerText = "Atualizar Prompt";

window.scrollTo({
top:0,
behavior:"smooth"
});

}catch(error){

console.log(error);

alert("Erro ao editar");

}

}

/* APAGAR */

async function apagarPrompt(id){

try{

const confirmar =
confirm("Deseja apagar?");

if(!confirmar) return;

await deleteDoc(doc(db,"prompts",id));

listarPrompts();

carregarDashboard();

alert("✅ Apagado");

}catch(error){

console.log(error);

alert("Erro ao apagar");

}

}

/* LIKE */

async function likePrompt(id,likesAtual){

const ref =
doc(db,"prompts",id);

await updateDoc(ref,{

likes: likesAtual + 1

});

listarPrompts();

}

/* LOGOUT */

document
.getElementById("logout")
.addEventListener("click", async () => {

await signOut(auth);

window.location.href = "login.html";

});

/* START */

carregarCategorias();

listarPrompts();

carregarDashboard();

</script>

</body>

</html>
