<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Checkout Premium</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
}

.box{
background:#111827;
padding:25px;
border-radius:20px;
margin-bottom:25px;
}

h1{
margin-bottom:25px;
font-size:35px;
line-height:1.3;
}

h2{
margin-bottom:20px;
}

input,
select{
width:100%;
padding:16px;
border:none;
border-radius:12px;
background:#1e293b;
color:white;
font-size:16px;
margin-top:15px;
margin-bottom:20px;
outline:none;
}

button{
width:100%;
padding:18px;
border:none;
border-radius:12px;
font-size:17px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
margin-top:15px;
}

button:hover{
opacity:0.9;
transform:translateY(-2px);
}

.enviar-btn{
background:#38bdf8;
color:black;
}

.info{
background:#1e293b;
padding:20px;
border-radius:15px;
line-height:1.8;
margin-top:20px;
}

.preview{
width:100%;
border-radius:15px;
margin-top:20px;
max-height:400px;
object-fit:contain;
background:#0f172a;
padding:10px;
display:none;
}

.sucesso{
background:#14532d;
padding:25px;
border-radius:20px;
line-height:1.8;
margin-top:20px;
}

.copy-btn{
background:#f0b90b;
color:black;
margin-top:15px;
}

.erro{
background:#7f1d1d;
padding:18px;
border-radius:15px;
margin-top:20px;
line-height:1.7;
}

@media(max-width:768px){

h1{
font-size:28px;
}

.box{
padding:20px;
}

}

</style>

</head>

<body>

<div class="container">

<h1>
💳 Checkout Premium
</h1>

<div class="box">

<h2 id="tituloPrompt">
Carregando...
</h2>

<div class="info">

<p id="valorPrompt">
Preço: --
</p>

<p style="margin-top:10px;">
⚡ Acesso após validação
</p>

</div>

</div>

<div class="box">

<h2>
👤 Seus Dados
</h2>

<input
type="text"
id="nome"
placeholder="Seu nome"
>

<input
type="text"
id="whatsapp"
placeholder="Seu WhatsApp"
>

<select id="metodo">

<option value="binance">
🟡 Binance Pay
</option>

<option value="express">
💚 Multicaixa Express
</option>

</select>

<div id="dadosPagamento"></div>

<h2 style="margin-top:25px;">
📤 Enviar Comprovativo
</h2>

<input
type="file"
id="comprovativo"
accept="image/*"
>

<div
class="erro"
id="erroUpload"
style="display:none;"
>

⚠️ Se não conseguir selecionar imagem:
<br><br>

• Abra o site no Chrome
<br>

• Não abra dentro do WhatsApp/Facebook
<br>

• Permita acesso às fotos
<br>

• Atualize o navegador

</div>

<img
id="preview"
class="preview"
>

<button
id="comprar"
class="enviar-btn"
>

🚀 Enviar Compra

</button>

</div>

<div id="resultado"></div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
doc,
getDoc,
collection,
addDoc,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE */

const firebaseConfig = {

apiKey:
"AIzaSyDtej7UQeiU-c9if4EKQH62j-PlS1gHTxA",

authDomain:
"gamboprompts-8ff6d.firebaseapp.com",

projectId:
"gamboprompts-8ff6d",

storageBucket:
"gamboprompts-8ff6d.firebasestorage.app",

messagingSenderId:
"92750073125",

appId:
"1:92750073125:web:d29723c203a0468ecf1ecc"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

/* CLOUDINARY */

const CLOUDINARY_URL =
"https://api.cloudinary.com/v1_1/derwtydzg/image/upload";

const CLOUDINARY_PRESET =
"gamboprompts";

/* PEGAR ID */

const params =
new URLSearchParams(window.location.search);

const id =
params.get("id");

let promptData = null;

/* CARREGAR PROMPT */

async function carregarPrompt(){

try{

const ref =
doc(db,"prompts",id);

const snap =
await getDoc(ref);

if(!snap.exists()){

alert("Prompt não encontrado");

return;

}

promptData = snap.data();

document.getElementById("tituloPrompt")
.innerText =
promptData.titulo;

document.getElementById("valorPrompt")
.innerText =
`Preço: ${promptData.preco || 0} Kz`;

}catch(error){

console.log(error);

alert("Erro ao carregar prompt");

}

}

/* MOSTRAR PAGAMENTO */

function mostrarPagamento(){

const metodo =
document.getElementById("metodo").value;

const box =
document.getElementById("dadosPagamento");

if(metodo === "binance"){

box.innerHTML = `

<div class="info">

<h2 style="color:#f0b90b;">
🟡 Binance Pay
</h2>

<p style="margin-top:15px;">
Binance ID:
</p>

<h1 style="
margin-top:10px;
color:#f0b90b;
font-size:35px;
">
450040438
</h1>

<button
class="copy-btn"
id="copiarBinance"
>

📋 Copiar Binance ID

</button>

<p style="
margin-top:20px;
line-height:1.8;
">

1. Abra Binance Pay<br>
2. Envie o valor<br>
3. Tire screenshot<br>
4. Envie comprovativo abaixo

</p>

</div>

`;

setTimeout(()=>{

const copiar =
document.getElementById("copiarBinance");

if(copiar){

copiar.addEventListener("click",()=>{

navigator.clipboard.writeText(
"450040438"
);

copiar.innerText =
"✅ Copiado";

});

}

},200);

}else{

box.innerHTML = `

<div class="info">

<h2 style="color:#22c55e;">
💚 Multicaixa Express
</h2>

<p style="margin-top:15px;">
Número:
</p>

<h1 style="
margin-top:10px;
color:#22c55e;
font-size:35px;
">
924539161
</h1>

<p style="
margin-top:20px;
line-height:1.8;
">

1. Faça transferência<br>
2. Tire screenshot<br>
3. Envie comprovativo abaixo

</p>

</div>

`;

}

}

/* ALTERAR MÉTODO */

document
.getElementById("metodo")
.addEventListener("change",mostrarPagamento);

/* PREVIEW */

document
.getElementById("comprovativo")
.addEventListener("change",(e)=>{

const file =
e.target.files[0];

if(!file){

document.getElementById("preview")
.style.display = "none";

return;

}

if(!file.type.startsWith("image/")){

alert("Selecione apenas imagem");

return;

}

const reader =
new FileReader();

reader.onload = function(event){

const preview =
document.getElementById("preview");

preview.src =
event.target.result;

preview.style.display =
"block";

};

reader.readAsDataURL(file);

});

/* DETECTAR ERRO */

window.addEventListener("load",()=>{

setTimeout(()=>{

const input =
document.getElementById("comprovativo");

if(input.disabled){

document.getElementById("erroUpload")
.style.display = "block";

}

},1000);

});

/* ENVIAR */

document
.getElementById("comprar")
.addEventListener("click", async ()=>{

const nome =
document.getElementById("nome").value;

const whatsapp =
document.getElementById("whatsapp").value;

const metodo =
document.getElementById("metodo").value;

const comprovativo =
document.getElementById("comprovativo").files[0];

if(nome === "" || whatsapp === ""){

alert("Preencha os dados");

return;

}

if(!comprovativo){

alert("Envie comprovativo");

return;

}

try{

document.getElementById("comprar")
.innerText =
"Enviando...";

const formData =
new FormData();

formData.append(
"file",
comprovativo
);

formData.append(
"upload_preset",
CLOUDINARY_PRESET
);

const resposta =
await fetch(
CLOUDINARY_URL,
{
method:"POST",
body:formData
}
);

const dados =
await resposta.json();

const comprovativoUrl =
dados.secure_url;

/* FIREBASE */

await addDoc(
collection(db,"compras"),
{

nome,
whatsapp,
promptId:id,
promptTitulo:promptData.titulo,
valor:promptData.preco || 0,
metodo,
status:"pendente",
comprovativo: comprovativoUrl,
data:serverTimestamp()

}
);

document.getElementById("resultado")
.innerHTML = `

<div class="sucesso">

<h2>
✅ Compra Enviada
</h2>

<p style="margin-top:15px;">
Seu pagamento foi enviado para análise.
</p>

<p style="margin-top:15px;">
📦 Prompt:
<strong>
${promptData.titulo}
</strong>
</p>

<p style="margin-top:15px;">
💳 Método:
<strong>
${metodo}
</strong>
</p>

<p style="margin-top:15px;">
⏳ Status:
<strong>
PENDENTE
</strong>
</p>

<p style="margin-top:15px;">
Você receberá acesso após validação.
</p>

</div>

`;

document.getElementById("comprar")
.style.display = "none";

}catch(error){

console.log(error);

alert("Erro ao enviar");

document.getElementById("comprar")
.innerText =
"🚀 Enviar Compra";

}

});

/* START */

carregarPrompt();

mostrarPagamento();

</script>

</body>

</html>
