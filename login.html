<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login Admin</title>

<style>

body{
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial;
}

.box{
background:#1e293b;
padding:30px;
border-radius:20px;
width:100%;
max-width:400px;
}

h1{
color:white;
margin-bottom:25px;
text-align:center;
}

input{
width:100%;
padding:15px;
margin-bottom:20px;
border:none;
border-radius:12px;
background:#0f172a;
color:white;
font-size:16px;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#38bdf8;
color:black;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

</style>

</head>

<body>

<div class="box">

<h1>🔐 Login Admin</h1>

<input
type="email"
id="email"
placeholder="Email"
>

<input
type="password"
id="password"
placeholder="Password"
>

<button id="entrar">

Entrar

</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyDtej7UQeiU-c9if4EKQH62j-PlS1gHTxA",
authDomain: "gamboprompts-8ff6d.firebaseapp.com",
projectId: "gamboprompts-8ff6d",
storageBucket: "gamboprompts-8ff6d.firebasestorage.app",
messagingSenderId: "92750073125",
appId: "1:92750073125:web:d29723c203a0468ecf1ecc"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

document.getElementById("entrar")
.addEventListener("click", async () => {

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

try{

await signInWithEmailAndPassword(
auth,
email,
password
);

window.location.href =
"admin.html";

}catch(error){

alert("Login inválido");

}

});

</script>

</body>

</html>
