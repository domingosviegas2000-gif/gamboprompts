<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel de Compras</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
padding:20px;
}

.container{
max-width:1400px;
margin:auto;
}

.topo{
display:flex;
justify-content:space-between;
align-items:center;
gap:20px;
flex-wrap:wrap;
margin-bottom:30px;
}

h1{
font-size:35px;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:#111827;
padding:25px;
border-radius:20px;
}

.card h2{
font-size:35px;
margin-top:15px;
}

.lista{
display:grid;
gap:20px;
}

.compra{
background:#111827;
padding:25px;
border-radius:20px;
border-left:6px solid #f59e0b;
}

.compra-topo{
display:flex;
justify-content:space-between;
gap:20px;
flex-wrap:wrap;
margin-bottom:20px;
}

.status{
padding:8px 15px;
border-radius:30px;
font-size:14px;
font-weight:bold;
display:inline-block;
}

.pendente{
background:#f59e0b;
color:black;
}

.aprovado{
background:#22c55e;
color:white;
}

.rejeitado{
background:#ef4444;
color:white;
}

.info{
line-height:2;
color:#cbd5e1;
}

.botoes{
display:flex;
gap:15px;
margin-top:25px;
flex-wrap:wrap;
}

button{
padding:15px 20px;
border:none;
border-radius:12px;
font-size:15px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
opacity:0.9;
transform:translateY(-2px);
}

.aprovar-btn{
background:#22c55e;
color:white;
flex:1;
}

.rejeitar-btn{
background:#ef4444;
color:white;
flex:1;
}

.whatsapp-btn{
background:#25d366;
color:white;
flex:1;
}

.vazio{
background:#111827;
padding:40px;
border-radius:20px;
text-align:center;
color:#94a3b8;
}

audio{
display:none;
}

@media(max-width:768px){

h1{
font-size:28px;
}

}

</style>

</head>

<body>

<div class="container">

<div class="topo">

<h1>
💳 Painel de Compras
</h1>

<button
onclick="location.reload()"
style="
background:#38bdf8;
color:black;
"
>
🔄 Atualizar
</button>

</div>

<div class="stats">

<div class="card">

<p>🛒 Total Compras</p>

<h2 id="totalCompras">
0
</h2>

</div>

<div class="card">

<p>🟡 Pendentes</p>

<h2 id="pendentes">
0
</h2>

</div>

<div class="card">

<p>✅ Aprovadas</p>

<h2 id="aprovadas">
0
</h2>

</div>

<div class="card">

<p>❌ Rejeitadas</p>

<h2 id="rejeitadas">
0
</h2>

</div>

</div>

<div id="lista" class="lista"></div>

</div>

<audio id="somNotificacao">

<source
src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"
type="audio/ogg">

</audio>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
doc,
updateDoc,
query,
orderBy
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE */

const firebaseConfig = {

apiKey: "AIzaSyDtej7UQeiU-c9if4EKQH62j-PlS1gHTxA",

authDomain: "gamboprompts-8ff6d.firebaseapp.com",

projectId: "gamboprompts-8ff6d",

storageBucket: "gamboprompts-8ff6d.firebasestorage.app",

messagingSenderId: "92750073125",

appId: "1:92750073125:web:d29723c203a0468ecf1ecc"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const lista =
document.getElementById("lista");

let ultimoTotal = 0;

/* CARREGAR COMPRAS */

async function carregarCompras(){

try{

const q =
query(
collection(db,"compras"),
orderBy("data","desc")
);

const snapshot =
await getDocs(q);

lista.innerHTML = "";

let total = 0;
let pendentes = 0;
let aprovadas = 0;
let rejeitadas = 0;

/* NOTIFICAÇÃO */

if(snapshot.size > ultimoTotal && ultimoTotal !== 0){

document
.getElementById("somNotificacao")
.play();

}

ultimoTotal = snapshot.size;

if(snapshot.empty){

lista.innerHTML = `

<div class="vazio">

<h2>
Nenhuma compra encontrada
</h2>

<p style="margin-top:15px;">
As compras aparecerão aqui.
</p>

</div>

`;

}

/* LISTAR */

snapshot.forEach((docItem) => {

const data = docItem.data();

total++;

if(data.status === "pendente"){
pendentes++;
}

if(data.status === "aprovado"){
aprovadas++;
}

if(data.status === "rejeitado"){
rejeitadas++;
}

const div =
document.createElement("div");

div.className = "compra";

div.innerHTML = `

<div class="compra-topo">

<div>

<h2>
${data.promptTitulo}
</h2>

<p style="
margin-top:10px;
color:#94a3b8;
">
Pedido ID:
${docItem.id}
</p>

</div>

<div>

<span class="status ${data.status}">
${data.status.toUpperCase()}
</span>

</div>

</div>

<div class="info">

<p>
👤 Cliente:
<strong>${data.nome}</strong>
</p>

<p>
📱 WhatsApp:
<strong>${data.whatsapp}</strong>
</p>

<p>
💳 Método:
<strong>${data.metodo}</strong>
</p>

<p>
💰 Valor:
<strong>${data.valor} Kz</strong>
</p>

</div>

<div class="botoes">

<button
class="aprovar-btn"
data-id="${docItem.id}"
>
✅ Aprovar
</button>

<button
class="rejeitar-btn"
data-id="${docItem.id}"
>
❌ Rejeitar
</button>

<button
class="whatsapp-btn"
onclick="window.open('https://wa.me/244${data.whatsapp}?text=Olá%20${encodeURIComponent(data.nome)}%20sobre%20o%20prompt:%20${encodeURIComponent(data.promptTitulo)}')"
>
💬 WhatsApp
</button>

</div>

`;

/* APROVAR */

div.querySelector(".aprovar-btn")
.addEventListener("click", async () => {

await updateDoc(
doc(db,"compras",docItem.id),
{
status:"aprovado"
}
);

alert("✅ Compra aprovada");

carregarCompras();

});

/* REJEITAR */

div.querySelector(".rejeitar-btn")
.addEventListener("click", async () => {

await updateDoc(
doc(db,"compras",docItem.id),
{
status:"rejeitado"
}
);

alert("❌ Compra rejeitada");

carregarCompras();

});

lista.appendChild(div);

});

/* STATS */

document.getElementById("totalCompras")
.innerText = total;

document.getElementById("pendentes")
.innerText = pendentes;

document.getElementById("aprovadas")
.innerText = aprovadas;

document.getElementById("rejeitadas")
.innerText = rejeitadas;

}catch(error){

console.log(error);

alert("Erro ao carregar compras");

}

}

/* AUTO UPDATE */

setInterval(() => {

carregarCompras();

},10000);

/* START */

carregarCompras();

</script>

</body>

</html>
