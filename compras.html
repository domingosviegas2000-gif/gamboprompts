<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel de Compras</title>

<style>

body{
background:#0f172a;
color:white;
font-family:Arial;
padding:20px;
}

.container{
max-width:1200px;
margin:auto;
}

.box{
background:#111827;
padding:20px;
border-radius:15px;
margin-bottom:20px;
}

button{
padding:14px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
margin-top:10px;
}

.aprovar{
background:#22c55e;
color:white;
}

.rejeitar{
background:#ef4444;
color:white;
}

.whatsapp{
background:#38bdf8;
color:black;
}

img{
width:100%;
max-height:400px;
object-fit:contain;
background:#0f172a;
border-radius:10px;
margin-top:15px;
}

.status{
font-weight:bold;
margin-top:10px;
}

.pendente{
color:#f59e0b;
}

.aprovado{
color:#22c55e;
}

</style>

</head>

<body>

<div class="container">

<h1>
💳 Painel de Compras
</h1>

<div id="lista"></div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
doc,
updateDoc,
addDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyDtej7UQeiU-c9if4EKQH62j-PlS1gHTxA",
authDomain: "gamboprompts-8ff6d.firebaseapp.com",
projectId: "gamboprompts-8ff6d",
storageBucket: "gamboprompts-8ff6d.firebasestorage.app",
messagingSenderId: "92750073125",
appId: "1:92750073125:web:d29723c203a0468ecf1ecc"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const lista =
document.getElementById("lista");

async function carregarCompras(){

const snapshot =
await getDocs(collection(db,"compras"));

lista.innerHTML = "";

snapshot.forEach((docItem)=>{

const data =
docItem.data();

lista.innerHTML += `

<div class="box">

<h2>
${data.promptTitulo}
</h2>

<p>
👤 ${data.nome}
</p>

<p>
📱 ${data.whatsapp}
</p>

<p>
💳 ${data.metodo}
</p>

<p>
💰 ${data.valor} Kz
</p>

<p class="status ${data.status}">

${data.status.toUpperCase()}

</p>

<img src="${data.comprovativo}">

<button
class="aprovar"
onclick="aprovarCompra(
'${docItem.id}',
'${data.promptId}',
'${data.whatsapp}'
)"
>

✅ Aprovar

</button>

<button
class="rejeitar"
onclick="rejeitarCompra('${docItem.id}')"
>

❌ Rejeitar

</button>

<button
class="whatsapp"
onclick="window.open('https://wa.me/244${data.whatsapp}')"
>

💬 WhatsApp

</button>

</div>

`;

});

}

window.aprovarCompra =
async function(id,promptId,whatsapp){

await updateDoc(
doc(db,"compras",id),
{
status:"aprovado"
}
);

await addDoc(
collection(db,"acessos"),
{
promptId,
whatsapp,
status:"aprovado"
}
);

localStorage.setItem(
"acessoPremium",
promptId
);

alert("✅ Compra aprovada");

carregarCompras();

}

window.rejeitarCompra =
async function(id){

await updateDoc(
doc(db,"compras",id),
{
status:"rejeitado"
}
);

alert("❌ Compra rejeitada");

carregarCompras();

}

carregarCompras();

</script>

</body>

</html>
